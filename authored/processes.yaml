- id: GP-0002
  title: From filing to registration (sections 27, 31, 33, 34, 52 and 68)
  scope: An application from filing to registration or lapse, as a customer would follow it. The examination report and
    what follows it are GP-0001; opposition proceedings are named, not set out. The times are explained, never computed.
  steps:
  - id: filing
    label: Application filed
    actor: applicant
    kind: start
    text: A person applies to register a trade mark for goods and/or services.
    ref: TMA1995/s27(1)
    quote: 'A person may apply for the registration of a trade mark in respect of goods and/or services if:'
    concepts:
    - GC-0131
    - GC-0091
  - id: examination
    label: Examination
    actor: registrar
    kind: decision
    text: The Registrar examines the application and reports on whether it was made in accordance with the Act and whether
      there are grounds for rejecting it.
    ref: TMA1995/s31
    quote: 'The Registrar must, in accordance with the regulations, examine and report on:'
    concepts:
    - GC-0092
  - id: report
    label: Examination report
    actor: registrar
    kind: event
    text: If the Registrar reasonably believes the application is not in accordance with the Act or that there are grounds
      for rejecting it, the Registrar reports that belief. What follows is set out in GP-0001.
    ref: TMR1995/r4.8(1)
    quote: 'the Registrar reasonably believes that:'
    concepts:
    - GC-0179
    continues_in: GP-0001
  - id: acceptance
    label: Acceptance
    actor: registrar
    kind: event
    text: The Registrar must accept the application unless satisfied that it is not in accordance with the Act or that
      there are grounds for rejecting it.
    ref: TMA1995/s33(1)
    quote: 'The Registrar must, after the examination, accept the application unless he or she is satisfied that:'
    concepts:
    - GC-0093
  - id: acceptance_published
    label: Acceptance notified and published
    actor: registrar
    kind: event
    text: The Registrar notifies the applicant of the decision and publishes it.
    ref: TMA1995/s34(b)
    quote: publish the decision in accordance with the regulations.
  - id: opposition
    label: Opposition
    actor: any_person
    kind: event
    text: After acceptance, a person may oppose registration by filing a notice of opposition. Opposition proceedings
      are not set out here.
    ref: TMA1995/s52(1)
    quote: If the Registrar has accepted an application for the registration of a trade mark, a person may oppose the
      registration by filing a notice of opposition.
    concepts:
    - GC-0040
    - GC-0103
  - id: registration
    label: Registration
    actor: registrar
    kind: end
    text: The Registrar must register an accepted trade mark within the period the Regulations provide, if there was
      no opposition or an opposition ended in one of the ways section 68 lists.
    ref: TMA1995/s68(1)
    quote: 'The Registrar must, within the period provided under the regulations, register a trade mark that has been
      accepted for registration:'
    concepts:
    - GC-0141
  - id: lapse
    label: Lapse
    actor: law
    kind: end
    text: If the trade mark is not registered under section 68(1), the application lapses.
    ref: TMA1995/s68
    quote: Otherwise, the application for the registration of the trade mark lapses.
    concepts:
    - GC-0098
  transitions:
  - from: filing
    to: examination
    when: the Registrar examines the application
    ref: TMA1995/s31
    quote: 'The Registrar must, in accordance with the regulations, examine and report on:'
  - from: examination
    to: acceptance
    when: the examination leaves the Registrar satisfied of neither a defect in the application nor a ground for rejecting
