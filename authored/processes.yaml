    quote: notify the applicant of his or her decision under section 33; and
  - from: acceptance_published
    to: opposition
    when: a person files a notice of opposition
    ref: TMA1995/s52(1)
    quote: If the Registrar has accepted an application for the registration of a trade mark, a person may oppose the
