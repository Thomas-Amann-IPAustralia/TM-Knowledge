    from:
    - acceptance_published
    text: A notice of intention to oppose may be filed within 2 months from the day the acceptance is published. The
      date is not calculated here.
    ref: TMR1995/r5.6(1)
    quote: the period for filing a notice of intention to oppose is 2 months from the day the acceptance of the trade
