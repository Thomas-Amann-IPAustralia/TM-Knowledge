# Every element quotes its unit or passage; the envelope's evidence is every quote, located.
- id: GP-0001
  title: Examination report, response, further report, deferment and lapse (regulations 4.8 to 4.14, sections 33
    and 37)
  scope: An application under examination before acceptance. The regulations' times are explained, never computed.
  steps:
  - id: report
    label: Examination report
    actor: registrar
    kind: event
    text: The Registrar reports a belief that the application is not in accordance with the Act or that there are
      grounds for rejecting it.
    ref: TMR1995/r4.8(1)
    quote: 'the Registrar reasonably believes that:'
    concepts:
    - GC-0179
  - id: response
    label: Applicant's response
    actor: applicant
    kind: event
    text: 'The applicant may respond in writing: contest the belief, contest another matter, provide documents or
      evidence, or ask to amend.'
    ref: TMR1995/r4.9(1)
    quote: An applicant may respond in writing to the Registrar’s report under regulation 4.8.
  - id: consideration
    label: The Registrar considers the response
    actor: registrar
    kind: decision
    text: On receiving a response, the Registrar must consider it.
    ref: TMR1995/r4.10(1)
    quote: On receipt of a response under regulation 4.9, the Registrar must consider the response.
  - id: further_report
    label: Further report
    actor: registrar
    kind: event
    text: If the Registrar continues to believe there are grounds, the Registrar reports again; the applicant may
      respond to it as to the first.
    ref: TMR1995/r4.10(2)
    quote: 'If the Registrar continues to believe that:'
  - id: deferment
    label: Acceptance deferred
    actor: registrar
    kind: event
    text: At the applicant's written request, the Registrar may defer acceptance where there are section 44 grounds
      because of another trade mark.
    ref: TMR1995/r4.13(1)
    quote: 'The Registrar may, at the request of the applicant in writing, defer acceptance of an application for
      registration of a trade mark, if:'
    concepts:
    - GC-0096
  - id: acceptance
    label: Acceptance
    actor: registrar
    kind: end
    text: The Registrar must accept unless satisfied that the application is not in accordance with the Act or that
      there are grounds for rejecting it.
    ref: TMA1995/s33(1)
    quote: 'The Registrar must, after the examination, accept the application unless he or she is satisfied that:'
    concepts:
    - GC-0093
  - id: rejection
    label: Rejection
    actor: registrar
    kind: end
    text: If satisfied of a ground, the Registrar must reject, but not without giving the applicant an opportunity
      of being heard.
    ref: TMA1995/s33(4)
    quote: The Registrar may not reject an application without giving the applicant an opportunity of being heard.
  - id: lapse
    label: Lapse
    actor: law
    kind: end
    text: An application lapses if it is not accepted within the prescribed period, or that period as extended.
    ref: TMA1995/s37(1)
    quote: an application lapses if it is not accepted within the prescribed period or within that period as extended
      in accordance with the regulations
  transitions:
  - from: report
    to: response
    when: the applicant responds in writing
    ref: TMR1995/r4.9(1)
    quote: An applicant may respond in writing to the Registrar’s report under regulation 4.8.
  - from: response
    to: consideration
    when: the Registrar receives the response
    ref: TMR1995/r4.10(1)
    quote: On receipt of a response under regulation 4.9, the Registrar must consider the response.
  - from: consideration
    to: further_report
    when: the Registrar continues to believe there are grounds or a defect
    ref: TMR1995/r4.10(2)
    quote: 'If the Registrar continues to believe that:'
    needs:
    - what the Registrar decides on the response
  - from: consideration
    to: acceptance
    when: the Registrar is no longer satisfied that there are grounds for rejecting it
    ref: TMA1995/s33(1)
    quote: 'The Registrar must, after the examination, accept the application unless he or she is satisfied that:'
    needs:
    - what the Registrar decides on the response
  - from: consideration
    to: rejection
    when: the Registrar is satisfied there are grounds, after giving the applicant an opportunity of being heard
    ref: TMA1995/s33(4)
    quote: The Registrar may not reject an application without giving the applicant an opportunity of being heard.
    needs:
    - what the Registrar decides on the response
    - whether a hearing was offered
  - from: further_report
    to: response
    when: the applicant responds to the further report, as to a first report
    ref: TMR1995/r4.10(4)
    quote: Regulation 4.9 and this regulation apply to a report under subregulation (2) as if it were a report under
      regulation 4.8.
  - from: report
    to: deferment
    when: the applicant asks in writing and the grounds are section 44 grounds because of another trade mark
    ref: TMR1995/r4.13(1)
    quote: 'The Registrar may, at the request of the applicant in writing, defer acceptance of an application for
      registration of a trade mark, if:'
    needs:
    - whether a written request was made
    grounds:
    - TMA1995/s44
  - from: further_report
    to: deferment
    when: the applicant asks in writing and the grounds are section 44 grounds because of another trade mark
    ref: TMR1995/r4.13(1)
    quote: 'The Registrar may, at the request of the applicant in writing, defer acceptance of an application for
      registration of a trade mark, if:'
    needs:
    - whether a written request was made
    grounds:
    - TMA1995/s44
  - from: deferment
    to: consideration
    when: the deferment period ends, for example when the Registrar is satisfied there are no longer section 44
      grounds
    ref: TMR1995/r4.14(2)(b)
    quote: when the Registrar is reasonably satisfied that there are no longer grounds for rejecting the application
    needs:
    - why acceptance was deferred
    - whether the deferment has ended
  - from: report
    to: lapse
    when: the application is not accepted within the prescribed period, or that period as extended
    ref: TMA1995/s37(1)
    quote: an application lapses if it is not accepted within the prescribed period or within that period as extended
      in accordance with the regulations
    needs:
    - the lapse date the report states
    - any extension
    - any period of deferment
  - from: further_report
    to: lapse
    when: the application is not accepted within the prescribed period, or that period as extended
    ref: TMA1995/s37(1)
    quote: an application lapses if it is not accepted within the prescribed period or within that period as extended
      in accordance with the regulations
    needs:
    - the lapse date the report states
    - any extension
    - any period of deferment
  deadlines:
  - id: lapse_date_in_report
    from:
    - report
    text: The report states the date the application will lapse if not accepted earlier. Read it from the report;
      it is not recalculated here.
    ref: TMR1995/r4.8(2)
    quote: A report under subregulation (1) must include notification of the date on which the application will
      lapse if it is not accepted earlier.
  - id: fifteen_months
    from:
    - report
    - further_report
    text: The prescribed period is generally 15 months from the first report, or from a further report that raises
      new grounds.
    ref: TMR1995/r4.12(1)
    quote: 'the prescribed period, for an application in respect of which a report is made under regulation 4.8,
      is:'
  - id: deferment_not_counted
    from:
    - deferment
    text: A period in which acceptance is deferred does not count towards the 15 months.
    ref: TMR1995/r4.12(2)
    quote: no account is to be taken of a period in which acceptance of the application is deferred under regulation
      4.13
  - id: further_report_lapse_date
    from:
    - further_report
    text: A further report states a lapse date too, unless acceptance is deferred.
    ref: TMR1995/r4.10(3)
    quote: Unless acceptance of an application is deferred, a report under subregulation (2) in relation to that
      application must include notification of the date on which the application will lapse if it is not accepted
      earlier.
  notes: 'The template is the procedure, not any matter''s history. A matter''s events are matched to its steps;
    where a branch depends on what the Registrar decides, the template names what must be known and does not guess.
    No date is computed: a branch''s dates are enabled only once its rules and edge cases are reviewed (A02), and
    none is.'
