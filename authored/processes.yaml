- id: GP-0001
  title: Examination report, response, further report, deferment and lapse (regulations 4.8 to 4.14, sections 33
    and 37)
  scope: An application under examination before acceptance. The regulations' times are explained, never computed.
  steps:
  - id: report
    label: Examination report
    actor: registrar
    kind: event
    text: The Registrar reports a belief that the application is not in accordance with the Act or that there are
      grounds for rejecting it.
    ref: TMR1995/r4.8(1)
    quote: 'the Registrar reasonably believes that:'
    concepts:
    - GC-0179
  - id: response
    label: Applicant's response
    actor: applicant
    kind: event
    text: 'The applicant may respond in writing: contest the belief, contest another matter, provide documents or
      evidence, or ask to amend.'
    ref: TMR1995/r4.9(1)
    quote: An applicant may respond in writing to the Registrar’s report under regulation 4.8.
  - id: consideration
    label: The Registrar considers the response
    actor: registrar
    kind: decision
    text: On receiving a response, the Registrar must consider it.
    ref: TMR1995/r4.10(1)
    quote: On receipt of a response under regulation 4.9, the Registrar must consider the response.
  - id: further_report
    label: Further report
    actor: registrar
    kind: event
    text: If the Registrar continues to believe there are grounds, the Registrar reports again; the applicant may
      respond to it as to the first.
    ref: TMR1995/r4.10(2)
    quote: 'If the Registrar continues to believe that:'
  - id: deferment
    label: Acceptance deferred
    actor: registrar
    kind: event
    text: At the applicant's written request, the Registrar may defer acceptance where there are section 44 grounds
      because of another trade mark.
    ref: TMR1995/r4.13(1)
    quote: 'The Registrar may, at the request of the applicant in writing, defer acceptance of an application for
      registration of a trade mark, if:'
    concepts:
    - GC-0096
  - id: acceptance
    label: Acceptance
    actor: registrar
    kind: end
    text: The Registrar must accept unless satisfied that the application is not in accordance with the Act or that
      there are grounds for rejecting it.
    ref: TMA1995/s33(1)
    quote: 'The Registrar must, after the examination, accept the application unless he or she is satisfied that:'
    concepts:
    - GC-0093
  - id: rejection
    label: Rejection
    actor: registrar
    kind: end
    text: If satisfied of a ground, the Registrar must reject, but not without giving the applicant an opportunity
      of being heard.
    ref: TMA1995/s33(4)
    quote: The Registrar may not reject an application without giving the applicant an opportunity of being heard.
  - id: lapse
    label: Lapse
    actor: law
    kind: end
    text: An application lapses if it is not accepted within the prescribed period, or that period as extended.
    ref: TMA1995/s37(1)
    quote: an application lapses if it is not accepted within the prescribed period or within that period as extended
      in accordance with the regulations
  transitions:
  - from: report
    to: response
    when: the applicant responds in writing
    ref: TMR1995/r4.9(1)
    quote: An applicant may respond in writing to the Registrar’s report under regulation 4.8.
  - from: response
    to: consideration
    when: the Registrar receives the response
    ref: TMR1995/r4.10(1)
    quote: On receipt of a response under regulation 4.9, the Registrar must consider the response.
  - from: consideration
    to: further_report
    when: the Registrar continues to believe there are grounds or a defect
