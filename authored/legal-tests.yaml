    confidence: 0.8
    reasoning: Read clause by clause from section 44(1), its two exceptions in (3) and (4), and the deferment regulation.
      The effect of (1) is an obligation; (3) gives a discretion, which present prerequisites never turn into a
      must; (4) bars rejection on the other mark. Similarity of marks and of goods are evaluative.
    alternatives_considered:
    - 'Modelling (3) and (4) as conditions of (1) rather than exceptions: rejected, because the Act frames them
      as what the Registrar may do despite (1) (''Subject to subsections (3) and (4)'').'
    expert_should_check: Whether the 'other circumstances' limb of (3) and the continuous-use limb of (4) are the
      right granularity for a customer explanation.
- id: GL-0002
  provision: TMA1995/s43
  title: A connotation likely to deceive or cause confusion (section 43)
  ground: GC-0168
  actor: the Registrar
  authority: law
  scope:
    applies_to: an application, for the particular goods or services the connotation concerns
    proceeding: application_and_examination
  effect:
    kind: obligation
    text: The application must be rejected for those goods or services.
    ref: TMA1995/s43
    quote: An application for the registration of a trade mark in respect of particular goods or services must be
      rejected if
  condition:
    all:
    - id: has_connotation
      text: The trade mark, or a sign in it, has a connotation.
      ref: TMA1995/s43
      quote: because of some connotation that the trade mark or a sign contained in the trade mark has
      kind: evaluative
      concepts:
      - GC-0001
    - id: likely_to_deceive
      text: Because of that connotation, using the trade mark for those goods or services would be likely to deceive
        or cause confusion.
      ref: TMA1995/s43
      quote: the use of the trade mark in relation to those goods or services would be likely to deceive or cause
        confusion
      kind: evaluative
      concepts:
      - GC-0002
  routes:
  - id: condition_or_amendment
    text: Agree to a condition of registration, or amend the goods or services, so the likelihood of deceiving or
      confusing is removed.
    ref: TMM/Part29/9/9/5
    quote: An applicant will be able to overcome a geographical section 43 objection by agreeing to a condition
      of registration or a specification amendment which removes the likelihood of consumers being deceived or confused.
    authority: practice
    scope: a geographical section 43 objection
  notes: Section 43 has no exception in the Act. The Manual describes ways an objection may be answered; they are
    practice, and the one quoted is scoped to geographical references.
