- id: GL-0003
  provision: TMA1995/s41
  title: Not capable of distinguishing (section 41)
  ground: GC-0181
  actor: the Registrar
  authority: law
  scope:
    applies_to: an application, for the designated goods or services
    proceeding: application_and_examination
  effect:
    kind: obligation
    text: The application must be rejected.
    ref: TMA1995/s41(1)
    quote: An application for the registration of a trade mark must be rejected if the trade mark is not capable
      of distinguishing
  condition:
    id: subsection_3_or_4
    text: A trade mark is taken not to be capable of distinguishing only if subsection (3) or (4) applies (subsection
      (2)).
    any:
    - id: subsection_3
      text: 'Subsection (3): no inherent adaptation, and not shown to distinguish by use before filing.'
      all:
      - id: no_inherent_adaptation
        text: The trade mark is not to any extent inherently adapted to distinguish.
        ref: TMA1995/s41(3)(a)
        quote: the trade mark is not to any extent inherently adapted to distinguish the designated goods or services
          from the goods or services of other persons
        kind: evaluative
        concepts:
        - GC-0120
      - id: not_distinguishing_by_use
        text: The applicant has not used the trade mark before the filing date so much that it does in fact distinguish.
        ref: TMA1995/s41(3)(b)
        quote: the applicant has not used the trade mark before the filing date in respect of the application to
          such an extent that the trade mark does in fact distinguish
        kind: evaluative
        concepts:
        - GC-0041
        - GC-0091
    - id: subsection_4
      text: 'Subsection (4): some but not enough inherent adaptation, and it does not and will not distinguish on
        the combined effect of everything.'
      all:
      - id: some_inherent_adaptation
        text: The trade mark is to some extent, but not sufficiently, inherently adapted to distinguish.
        ref: TMA1995/s41(4)(a)
        quote: the trade mark is, to some extent, but not sufficiently, inherently adapted to distinguish
        kind: evaluative
        concepts:
        - GC-0059
      - id: does_not_and_will_not
        text: The trade mark does not and will not distinguish, having regard to its inherent adaptation, its use
          or intended use, and any other circumstances.
        ref: TMA1995/s41(4)(b)
        quote: 'the trade mark does not and will not distinguish the designated goods or services as being those
          of the applicant having regard to the combined effect of the following:'
        kind: evaluative
  evidence_requirements:
  - id: before_filing
    for:
    - not_distinguishing_by_use
    kind: relevance
    checks:
    - before_filing_date
    - dated
    text: Under subsection (3), only use before the filing date counts.
    ref: TMM/Part23/5/5/3
    quote: To be able to demonstrate this, the use must be before the filing date. Use after that date will not
      be considered.
    authority: practice
  - id: in_australia_same_mark
    for:
    - not_distinguishing_by_use
    kind: relevance
    checks:
    - in_australia
    - sign_as_applied
    text: Under subsection (3), the use must be in Australia, of the trade mark applied for or a substantially identical
      one.
    ref: TMM/Part23/5/5/2
    quote: any evidence of use must relate to use in Australia of the trade mark applied for or a substantially
      identical mark
    authority: practice
  - id: extensive_use
    for:
    - not_distinguishing_by_use
    kind: sufficiency
    text: Under subsection (3), the evidence should generally show extensive use as a trade mark; how much is enough
      is the examiner's assessment.
    ref: TMM/Part23/5/5/2
    quote: should generally show extensive use as a trade mark such that it is likely to be perceived as a brand
      distinguishing the goods or services of the applicant in the marketplace
    authority: practice
  - id: after_filing_relevant
    for:
    - does_not_and_will_not
    kind: relevance
    checks:
    - dated
    text: Under subsection (4), use after the filing date is also relevant.
    ref: TMM/Part23/4/4/3
    quote: However, if the application is to some extent inherently adapted to distinguish, use after the filing
      date is also relevant to determining the potential capacity to distinguish of the trade mark as at the date
      of filing.
    authority: practice
  - id: goods_and_dates
    for:
    - not_distinguishing_by_use
    - does_not_and_will_not
    kind: relevance
    checks:
    - items_covered
    - dated
    text: Say which goods or services the trade mark has been used for, and when it was first used and for how long.
    ref: TMM/Part23/3/3/4~1
    quote: when the trade mark was first used and the period of use
    authority: practice
  routes:
  - id: submissions
    text: Write to the Registrar with legal arguments, for example that the objection is valid for some goods or
      services but not others.
    ref: TMM/Part23/2/2/1
    quote: and/or that the objection raised may be valid for some goods or services but not others
    authority: practice
  - id: delete_part
    text: Delete the goods or services the objection is raised against.
    ref: TMM/Part23/2/2/2/1
    quote: If grounds for rejection have been raised in respect of only part of the specification of goods and/or
      services, the applicant may be able to overcome the problem by deleting that part.
    authority: practice
  - id: evidence_of_use
    text: File evidence of use, in a declaration.
    ref: TMR1995/r4.9(2)(c)
    quote: provide further documents or evidence in support of the application
    authority: law
  notes: 'Every condition of section 41 is evaluative: the system reports what the report records and what evidence
    is missing, never whether the trade mark is capable of distinguishing.'
