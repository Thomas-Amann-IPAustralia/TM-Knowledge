- id: GL-0001
  provision: TMA1995/s44
  title: Conflict with another person's earlier trade mark (section 44)
  ground: GC-0006
  actor: the Registrar
  authority: law
  scope:
    applies_to: an application for goods, item by item (subsection (1))
    proceeding: application_and_examination
    parallel: TMA1995/s44(2) states the same test for services, with similar services or closely related goods
  effect:
    kind: obligation
    text: The application must be rejected for the goods affected, subject to subsections (3) and (4).
    ref: TMA1995/s44(1)
    quote: 'Subject to subsections (3) and (4), an application for the registration of a trade mark (applicant’s
      trade mark) in respect of goods (applicant’s goods) must be rejected if:'
  condition:
    all:
    - id: same_or_similar_mark
      text: The applicant's trade mark is substantially identical with, or deceptively similar to, the other trade
        mark.
      ref: TMA1995/s44(1)(a)
      quote: 'the applicant’s trade mark is substantially identical with, or deceptively similar to:'
      kind: evaluative
      concepts:
      - GC-0065
      - GC-0154
    - id: other_mark_is_anothers
      text: The other trade mark is another person's, registered or applied for.
      any:
      - id: registered_by_another
        text: The other trade mark is registered by another person.
        ref: TMA1995/s44(1)(a)(i)
        quote: a trade mark registered by another person
        kind: fact
        ask: Is the trade mark the report cites registered, or still an application?
      - id: sought_by_another
        text: Registration of the other trade mark is being sought by another person.
        ref: TMA1995/s44(1)(a)(ii)
        quote: a trade mark whose registration in respect of similar goods or closely related services is being
          sought by another person
        kind: fact
        ask: Is the cited trade mark still an application, not yet registered?
    - id: similar_goods
      text: The other trade mark is for similar goods or closely related services.
      ref: TMA1995/s44(1)(a)(i)
      quote: in respect of similar goods or closely related services
      kind: evaluative
      concepts:
      - GC-0071
    - id: priority_not_earlier
      text: The applicant's priority date is not earlier than the other trade mark's.
      ref: TMA1995/s44(1)(b)
      quote: the priority date for the registration of the applicant’s trade mark in respect of the applicant’s
        goods is not earlier than the priority date for the registration of the other trade mark
      kind: fact
      concepts:
      - GC-0016
      ask: What is your application's priority date, and the cited trade mark's?
      derive:
        not_earlier_than:
        - application.priority_date
        - cited_mark.priority_date
  exceptions:
  - id: honest_concurrent_use
    text: Honest concurrent use, or other circumstances that make it proper to accept (subsection (3)).
    ref: TMA1995/s44(3)
    quote: 'If the Registrar in either case is satisfied:'
    effect:
      kind: discretion
      text: The Registrar may accept the application, subject to any conditions or limitations the Registrar thinks
        fit.
      ref: TMA1995/s44
      quote: the Registrar may accept the application for the registration of the applicant’s trade mark subject
        to any conditions or limitations that the Registrar thinks fit to impose
    condition:
      any:
      - id: hcu
        text: The Registrar is satisfied that there has been honest concurrent use of the two trade marks.
        ref: TMA1995/s44(3)(a)
        quote: that there has been honest concurrent use of the 2 trade marks
        kind: evaluative
        concepts:
        - GC-0066
      - id: other_circumstances
        text: The Registrar is satisfied that, because of other circumstances, it is proper to accept.
        ref: TMA1995/s44(3)(b)
        quote: that, because of other circumstances, it is proper to do so
        kind: evaluative
        concepts:
        - GC-0068
  - id: prior_continuous_use
    text: Continuous use from before the other trade mark's priority date (subsection (4)).
    ref: TMA1995/s44(4)
    quote: 'have continuously used the applicant’s trade mark for a period:'
    effect:
      kind: bar
      text: The Registrar may not reject the application because of the other trade mark.
      ref: TMA1995/s44
      quote: the Registrar may not reject the application because of the existence of the other trade mark
    condition:
      all:
      - id: continuous_use
        text: The Registrar is satisfied that the applicant (with any predecessor in title) has used the trade mark
          continuously over the period.
        ref: TMA1995/s44(4)
        quote: the applicant, or the applicant and the predecessor in title of the applicant, have continuously
          used the applicant’s trade mark
        kind: evaluative
      - id: use_began_before
        text: The period of use began before the other trade mark's priority date.
        ref: TMA1995/s44(4)(a)
        quote: beginning before the priority date for the registration of the other trade mark
        kind: fact
        concepts:
        - GC-0016
        ask: When did you first use the trade mark in Australia, and has the use been continuous since?
      - id: use_runs_to_priority
        text: The period of use runs to the applicant's own priority date.
        ref: TMA1995/s44(4)(b)
        quote: ending on the priority date for the registration of the applicant’s trade mark
        kind: fact
        ask: Has that use continued up to your application's priority date?
  routes:
  - id: evidence_for_3_or_4
    text: File evidence of use or of other circumstances, so the application can proceed under subsection (3) or
      (4).
    ref: TMM/Part27/5#1
    quote: It may be possible for the applicant to overcome a citation by filing evidence of use or other circumstances
      which would allow the application to proceed under s 44(3) or 44(4) of the Act.
    authority: practice
  - id: defer
    text: Ask the Registrar in writing to defer acceptance, for example while the cited application is finalised
      or while you gather what subsection (3) or (4) needs.
    ref: TMR1995/r4.13(1)
    quote: 'The Registrar may, at the request of the applicant in writing, defer acceptance of an application for
      registration of a trade mark, if:'
    authority: law
  notes: 'Subsection (2) is the same test for services and is named in the scope rather than repeated. Whether two
    marks are deceptively similar, and whether goods are similar, are the examiner''s assessments: the test never
    computes them.'
