  concept: GC-0002
  type: legal_test
  basis:
  - TMM/Part29/1#1
  notes: >-
    likely to deceive or cause confusion — also called: likelihood of deception or confusion,
    deceive or confuse, deception or confusion — not: deceptively similar, substantially
    identical, likelihood of confusion between trade marks
  approved_by: null
  approved_date: null
