# --- Added 2026-09-09 (S018) -----------------------------------------------
#
# The typings for the concepts authored from the whole Manual once the section 43
# boundary was withdrawn (ADR-0081, ADR-0095). Same rules as the 52 above: every
# `type` is this repository's own proposal for an expert to correct, `approved_by`
# is null, and nothing here has been read by a trade marks expert.
#
# Two things are worth knowing before reading them.
#
# **The distribution moved, and that is the finding.** The first 52 came out 30
# relevant_factor and 1 ground_of_refusal, because they were a vocabulary built
# around one ground. These come out with far more `none_of_these` — roles,
# documents, proceedings, outcomes and remedies, which the four groups were never
# shaped to hold. That is evidence about the taxonomy, not about the records
# (OQ-0024).
#
# **Several typings are deliberately inconsistent with each other and say so.**
# `divisional application` and `convention application` are typed differently on
# similar facts; `removal for non-use` is typed on the assumption that the four
# groups are about refusing an application rather than ending a registration.
# Each names the inconsistency in `expert_should_check` rather than hiding it.
