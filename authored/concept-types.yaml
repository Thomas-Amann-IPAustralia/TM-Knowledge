      it into elements. GC-0006 carries ground_of_refusal in this pass, so taking that
      reading would make one of the two redundant.
    expert_should_check: >-
      The split between this record and GT-0006. If 'ground for rejection' and 'likely
      to deceive or cause confusion' name the same thing in practice, one of the two typings
      is wrong and the vocabulary has a duplicate underneath it.
