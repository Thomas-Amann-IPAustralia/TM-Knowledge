      content_hash: sha256:b6690f96b0ebc5181ac9b42c2669b0de831371538a8cc414e94d5e54796ceeff
      quote: >-
        it is necessary for a decision maker to be clearly satisfied that use of the trade
        mark for the specified goods and / or services would be likely to deceive or cause
        confusion
    confidence: 0.85
    reasoning: >-
      The Manual states this as the thing a decision maker must be clearly satisfied of,
      which is the definition of a question the decision maker has to answer. Every other
      concept in the s 43 vocabulary either feeds this question or takes a case out of
      it.
    alternatives_considered:
    - >-
      ground_of_refusal — the phrase is the operative words of the statutory ground, and
