# Which of the four groups each approved concept belongs to — authored by a
# machine, unreviewed, and never signed by anybody (ADR-0079, ADR-0092).
#
# The owner ruled on OQ-0001 that the four groups are the right way to sort the
# 52 and asked to be come back to with the list. `tmk-typing` came back with it
# in S012 and nobody had the hours; ADR-0079 then changed who may fill it in.
# Every `type` below is this repository's own proposal for an expert to correct,
# not a taxonomy anybody has agreed. `approved_by` is null in all 52 records and
# only `tmk-transcribe`, reading a workbook a person signed, may ever fill it.
#
# Read `data/derived/reports/concept-typing.md` beside this file: it carries the
# same 52 judgements with the reasoning and the passages laid out to argue with.
#
# Every record here is `corpus_inferred`. The corpus never says "connotation is
# a legal test"; it says what a decision maker must be satisfied of, and the
# typing is a reading of that. Nothing in this file is `corpus_explicit`,
# because nothing in the Manual states a concept's group in terms.
- id: GT-0001
  concept: GC-0001
  type: legal_test
  basis:
  - TMM/Part29/1#1
  - TMM/Part29/2/2/4
  notes: >-
    connotation — also called: secondary meaning, implied meaning, secondary or implied
    meaning — not: denotation, deceptively similar, descriptive meaning
  approved_by: null
  approved_date: null
  authored:
    review_status: unreviewed
    authored_by: claude-opus-5
    authored_date: '2026-09-08'
    authoring_basis: corpus_inferred
    evidence:
    - ref: TMM/Part29/2/2/4
      span:
      - 186
      - 282
      content_hash: sha256:5a52a4dd52ef95b0e001380666cfbc14b907dda998e67a97a99859e9c179e298
      quote: >-
        If there is doubt that a connotation exists, then the ground for rejection should
        not be raised.
    - ref: TMM/Part29/1#1
      span:
      - 778
      - 978
      content_hash: sha256:b6690f96b0ebc5181ac9b42c2669b0de831371538a8cc414e94d5e54796ceeff
      quote: >-
        If the trade mark, or some part of the trade mark, contains a connotation that
        would be likely to deceive or confuse consumers within the relevant market, then
        a ground for rejection should be raised.
    confidence: 0.7
    reasoning: >-
      Section 43 makes rejection turn on there being a connotation, and Part 29.2.4 makes
      its existence something the Registrar has to be satisfied about before the ground
      is raised — doubt defeats it. A matter the decision maker must answer is a legal_test
      on the owner's four groups, so connotation is typed as the first of section 43's
      two elements rather than as material feeding into one.
    alternatives_considered:
    - >-
      relevant_factor — a connotation is also the thing found in a mark, and everything
      from a place name to an INN stem feeds into whether one exists. That would be the
      right reading if the four groups sorted concepts by what they are rather than by
      the part they play in the decision; it would also leave section 43's first element
      with no test.
    - >-
      ground_of_refusal — rejected because a connotation on its own refuses nothing. The
      Manual is explicit that a connotation must additionally be likely to deceive or
      confuse.
    expert_should_check: >-
      Whether the existence of a connotation is genuinely a separate question from whether
      the mark is likely to deceive, or whether practice runs the two together. GC-0002
      is typed legal_test on the same footing, and if they are one question the pair should
      collapse into it.
