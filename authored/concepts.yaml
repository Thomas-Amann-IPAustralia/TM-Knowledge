# Concepts an agent wrote from the whole Manual, unreviewed, signed by nobody
# (ADR-0079, ADR-0095).
#
# `eval/gold/concepts.yaml` holds 52 concepts a trade marks expert signed. All 52
# were found inside the section 43 boundary: 86 of their ~95 definition sources
# point at Part 29 alone. The owner withdrew that boundary on 2026-09-08 — "I
# would like to completely remove the s43 barrier" — and these are the concepts
# the other 53 Parts hold.
#
# **No expert has read a word of this file.** Every record says so in
# `authored.review_status`, `approved_by` is null in all of them, and only
# `tmk-transcribe`, reading a workbook a person signed, may ever change that.
#
# Each record names the passages it rests on with a span and a content hash cut
# from the pinned snapshot, an argument for the reading, the readings rejected,
# and the thing it most expects to have got wrong. Correcting a stated argument
# is the cheap half of review; composing one is the expensive half, and that is
# the whole bet ADR-0079 made.
#
# Eight records here cover ground a signed record already claims — GC-0035
# authorised user, GC-0016 priority date, GC-0042 revocation of acceptance,
# GC-0043 divisional application, GC-0046 Registrar, GC-0007 presumption of
# registrability, GC-0012 specification, GC-0050 reputation. Each says so in its
# `expert_should_check` and none of them displaces the signed record: an agent
# may not retire something a person signed (ADR-0080 consequence 2 runs the other
# way).
- id: GC-0053
  pref_label: ground for rejection
  alt_labels:
  - grounds for rejection
