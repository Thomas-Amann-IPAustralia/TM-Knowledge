  legislative_basis:
  - TMA1995/s39(1)
  - TMA1995/s18
  notes: >-
    The Manual records that there are currently no regulations made for the purposes of section 18,
    so this ground is never raised in examination. The concept is real in law and inert in practice,
    and that gap is the most useful thing about the record.
  approved_by: null
  approved_date: null
  authored:
    review_status: unreviewed
    authored_by: claude-opus-5
    authored_date: '2026-09-09'
    authoring_basis: corpus_explicit
    evidence:
