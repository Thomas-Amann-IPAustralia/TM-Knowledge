      span:
      - 215
      - 369
      content_hash: sha256:ddc789a4768f5dd8e12018c22ae4d7a867b62682584dd2ca1c03fcf53e212b0e
      quote: There are currently no regulations made for the purposes of section 18, which means grounds
        for rejection under s 39(1) are not raised during examination.
    - ref: TMA1995/s39
      span:
      - 115
      - 216
      content_hash: sha256:5c6142286d25888ad60e7b915ee08e6b4c74dfbbc868380658b3cfbba876b358
      quote: a sign that, under regulations made for the purposes of section 18, is not to be used
        as a trade mark
    confidence: 0.85
    reasoning: >-
      Section 39(1) names the class by reference to regulations under section 18, and the Manual states
      that no such regulations exist. Both halves are explicit, so the concept is recorded with its
      inertness attached rather than as a live ground.
    alternatives_considered:
    - >-
      Not holding the concept at all, on the ground that an examiner never raises it. Rejected because
      the Act still contains it and a knowledge base that silently omitted a statutory ground would
      misrepresent the law.
    expert_should_check: >-
      Whether 'prohibited sign' is the right preferred label. The Manual's Part 31 title pairs it
      with 'prescribed', and the Act itself uses neither word for s 39(1).
