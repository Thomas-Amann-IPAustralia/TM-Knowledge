      - 434
      content_hash: sha256:5c6142286d25888ad60e7b915ee08e6b4c74dfbbc868380658b3cfbba876b358
      quote: a sign so nearly resembling
    - ref: TMM/Part31/2#1
      span:
      - 197
      - 282
      content_hash: sha256:ddc32c6b14822d57cc13b56065f8a2a2ec5a602ebd231ad0faead8b8670b381e
      quote: is a sign so nearly resembling the prescribed sign as to be likely to be taken for it
    confidence: 0.75
    reasoning: >-
      The phrase is the Act's and the Manual quotes it as the operative test for subparagraph 39(2)(b)(i).
      It is held as a separate concept from deceptive similarity because the two use different words
      for different comparisons, and collapsing them would let a section 44 authority be cited into
      a section 39 question.
    alternatives_considered:
    - >-
      Treating it as an alt_label of 'deceptively similar'. Rejected: section 10 defines deceptive
      similarity by 'so nearly resembles … likely to deceive or cause confusion', which shares the
      resemblance limb but not the threshold.
    expert_should_check: >-
      Whether practice in fact applies the section 10 case law to this test. If it does, the two concepts
      are more closely related than this record says.
