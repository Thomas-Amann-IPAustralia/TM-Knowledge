- id: GC-0056
  pref_label: so nearly resembling
  alt_labels:
  - so nearly resembling as to be likely to be taken for it
  not_labels:
  - deceptively similar
  - substantially identical
  definition_sources:
  - TMM/Part31/2#1
  legislative_basis:
  - TMA1995/s39(2)(b)
  notes: >-
    A resemblance test that is not the section 44 one. The comparison is between the applicant's sign
    and a prescribed or prohibited sign, and the threshold is 'likely to be taken for it' rather than
    'likely to deceive or cause confusion'.
  approved_by: null
  approved_date: null
  authored:
    review_status: unreviewed
    authored_by: claude-opus-5
    authored_date: '2026-09-09'
    authoring_basis: corpus_explicit
    evidence:
