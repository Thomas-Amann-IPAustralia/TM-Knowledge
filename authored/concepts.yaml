  - TMA1995/s33(1)(b)
  notes: >-
    The Manual treats the grounds as a closed set fixed by the Act and Regulations. Whether a formality
    failure under paragraph 33(1)(a) is a 'ground for rejection' in the same sense as sections 39-44
    is a real question the passage leaves open.
  approved_by: null
  approved_date: null
  authored:
    review_status: unreviewed
    authored_by: claude-opus-5
    authored_date: '2026-09-09'
    authoring_basis: corpus_explicit
    evidence:
    - ref: TMM/Part20/5#1
      span:
      - 0
      - 131
      content_hash: sha256:53ac65102a07932fd67393905ea28f29ad056b2b475899968a88f18e877e9557
      quote: The Act and Regulations contain all the grounds upon which an application for registration
        of a trade mark may have to be rejected.
    - ref: TMA1995/s33
      span:
      - 180
      - 229
      content_hash: sha256:36311d92754a0ea33e97abec732d66bb149a577c8004ce2f28ee98bb3bcb54e2
      quote: there are grounds under this Act for rejecting it
    confidence: 0.8
    reasoning: >-
      The Manual states in terms that the Act and Regulations contain all the grounds, and section
      33(3) makes the Registrar's satisfaction that a ground exists the trigger for rejection. The
      concept is therefore the corpus's own, not a label imposed on it.
    alternatives_considered:
    - >-
      Treating each numbered ground (s 39, s 41, s 43 …) as a concept and holding no general concept
      above them. Rejected because the Manual reasons about 'grounds for rejection' as a class — Part
      23 and Part 27 are both titled 'Overcoming grounds for rejection' — and a vocabulary with no
      word for the class cannot represent that.
    expert_should_check: >-
      Whether a failure of the formality requirements under paragraph 33(1)(a) belongs inside this
      concept or beside it. The Manual's Part 10 treats formalities separately and section 33 lists
      them separately, which argues for beside.
