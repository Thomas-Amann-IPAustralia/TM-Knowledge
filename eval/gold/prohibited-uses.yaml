- id: PU-0001
  prohibited: This trade mark should be rejected under section 43 because the connotation is likely to
    deceive or cause confusion.
  kind: evaluative_conclusion
  why: Whether a connotation exists and whether it is likely to deceive is the decision maker's evaluative
    judgement on the material before them. The Manual requires the decision maker to be clearly satisfied;
    a system that states the conclusion has substituted itself for that person.
  detectable_by: eval
  related_questions:
  - CQ-0012
  - GA-0003
  notes: 'Distinguish from a permitted output: setting out the considerations, the criteria and the passages,
    and stopping.'
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0002
  prohibited: No section 43 ground arises here, so the application can proceed to acceptance.
  kind: evaluative_conclusion
  why: An assurance that no ground arises is an examination decision. It also speaks to grounds the system
    was never asked about — acceptance turns on every ground, not on section 43 alone.
  detectable_by: eval
  related_questions:
  - CQ-0012
  notes: The second half of this sentence is arguably a separate prohibition (overreach — see PU-0013).
    Splitting it in two is a reasonable correction.
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0003
  prohibited: 'Confidence that a section 43 ground applies: 82%.'
  kind: evaluative_conclusion
  why: No probability in this system is calibrated against examination outcomes, and none could be without
    a decision corpus. A number invites reliance that the underlying evidence does not support.
  detectable_by: test
  related_questions:
  - CQ-0012
  - GA-0003
  notes: A confidence attached to an *extraction* is legitimate and required (rule 8). A confidence attached
    to a legal conclusion is this.
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0004
  prohibited: Section 43 of the Act requires the connotation to be obvious, direct and immediate.
  kind: authority_conflation
  why: The section requires no such thing. That formulation is the Manual's statement of practice. Attributing
    it to the Act gives an examiner a statutory requirement that does not exist and takes away the Registrar's
    discretion in the same sentence.
  detectable_by: shacl
  related_questions:
  - CQ-0021
  - CQ-0024
  - GA-0001
  notes: 'Structurally detectable: the claim attaches a Manual-sourced proposition to a legislative ref.
    That is a constraint a shape can express.'
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0005
  prohibited: The Federal Court held in Primary Health Care that a distinction must be drawn between the
    denotation of a mark and its connotation.
  kind: authority_conflation
  why: The system holds the Manual's account of the decision and a citation. It does not hold the reasons.
    Stating a holding as fact represents a source the programme has never seen.
  detectable_by: test
  related_questions:
  - CQ-0023
  - GA-0009
  notes: 'A permitted form: "the Manual, at TMM/Part29/2/2/1~1, quotes Katzmann J in Primary Health Care
    as saying…". The provenance survives.'
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0006
  prohibited: To overcome the ground you must use the following endorsement.
  kind: authority_conflation
  why: The Manual records the endorsement the Registrar suggests. Presenting a suggestion as a requirement
    converts practice into obligation, which is exactly the Tier 3 reading an extraction system gets wrong
    while looking well-formed.
  detectable_by: eval
  related_questions:
  - CQ-0024
  - GA-0005
  notes: The modality judgement on GR-0021 and GR-0022 is the same judgement in the relationship set.
    If you change one, change both.
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0007
  prohibited: A trade mark containing the name of a country will attract a section 43 ground unless the
    specification is limited to goods from that country.
  kind: unsupported_inference
  why: The Manual sets criteria and gives examples on both sides — SHETLAND attracting a ground, BALI
    not. A general rule extracted from them discards the criteria that decided each one.
  detectable_by: eval
  related_questions:
  - CQ-0010
  - GA-0007
  notes: This one is deliberately plausible. It would pass a fluency check and a citation check, because
    every source it cites is real and relevant.
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0008
  prohibited: Because the mark closely resembles an earlier registered mark, a connotation arises that
    will deceive or confuse consumers.
  kind: unsupported_inference
  why: This reasons from a comparison between marks, which the Manual and the cited authority both put
    outside section 43. It is the most likely cross-contamination in the pilot, because Part 26 and Part
    29 share almost all of their vocabulary.
  detectable_by: shacl
  related_questions:
  - CQ-0007
  - GA-0011
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0009
  prohibited: The mark contains the INN stem "-ast", so a section 43 ground applies.
  kind: unsupported_inference
  why: The Manual requires the stem to be present in a meaningful way and gives counter-examples where
    it is not, including one built on this very stem. Treating list membership as sufficient inverts the
    guidance.
  detectable_by: eval
  related_questions:
  - CQ-0008
  - GA-0013
  notes: The Manual's own counter-example for this stem is a mark in which the letters appear inside an
    ordinary English word.
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0015
  prohibited: See also Re Applicant's Application [2021] ATMO 44.
  kind: overreach
  why: The programme holds case citations extracted from the Manual and nothing else. A citation not among
    them was invented, and an examiner cannot distinguish an invented neutral citation from a real one
    without checking every one.
  detectable_by: test
  related_questions:
  - CQ-0023
  notes: 'Fully mechanically detectable, and the cheapest test in this file: every emitted case citation
    must appear in the corpus''s case set.'
  approved_by: TC
  approved_date: '2026-08-26'
- id: PU-0018
  prohibited: Confusion under section 43 and confusion under section 44 are assessed the same way.
  kind: ambiguity_collapse
  why: One is confusion arising from a connotation within the mark; the other is confusion between the
    mark and another sign. The Manual keeps them apart expressly, and a distributional model will not.
  detectable_by: eval
  related_questions:
  - CQ-0007
  - GA-0011
  notes: The `not_labels` on GC-0002 encode the same distinction in the concept set. If this record survives,
    that one should too.
  approved_by: TC
  approved_date: '2026-08-26'
