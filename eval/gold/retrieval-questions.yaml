- id: GA-0001
  question: What is the test under section 43 and where does it come from?
  required_evidence:
  - TMM/Part29/1#1
  - TMM/Part29/3#1~2
  required_provisions:
  - TMA1995/s43
  qualifications_expected: That "obvious, direct and immediate" is the Manual's formulation and not the
    section's words. That the section is mandatory in application but engages only where the decision
    maker is clearly satisfied. That the Manual states practice and does not bind the Registrar's discretion.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0004
  - PU-0001
  notes: 'A correct-sounding failure here reads: "Section 43 requires the connotation to be obvious, direct
    and immediate." Every word of that is in the corpus and the attribution is wrong.'
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0003
  question: Is this connotation strong enough for a ground for rejection?
  required_evidence:
  - TMM/Part29/2/2/4
  - TMM/Part29/3#1~2
  - TMM/Part29/1#1
  required_provisions:
  - TMA1995/s43
  - TMA1995/s33(3)
  qualifications_expected: That the assessment is the decision maker's. That where there is doubt a connotation
    exists, the ground should not be raised. That the presumption of registrability applies to this section.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0001
  - PU-0002
  - PU-0003
  notes: 'Three prohibitions on one question, which is unusual and appropriate: this is the question the
    system is most likely to be asked and least entitled to answer.'
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0004
  question: When does a place name in a mark cause confusion?
  required_evidence:
  - TMM/Part29/9/9/3~1
  - TMM/Part29/9#1
  required_provisions:
  - TMA1995/s43
  qualifications_expected: That the criteria are cumulative. That the third — no other elements or surrounding
    circumstances mitigating the risk — is part of the test and not a footnote. That a qualifier such
    as "made in" is not necessary for a connotation to arise.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0007
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0005
  question: What endorsement is used where a mark contains an INN stem?
  required_evidence:
  - TMM/Part29/5/5/5
  required_provisions:
  - TMA1995/s43
  qualifications_expected: That the wording is the endorsement the Registrar suggests, not a prescribed
    form. That the INN-stem endorsement differs from the INN endorsement in TMM/Part29/5/5/4 and the two
    are not interchangeable. That the endorsement addresses the section 43 ground only.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0006
  notes: The source text contains a line-break artefact — "International Non- Proprietary Name stem" —
    which an answer should reproduce or silently repair, and it is not obvious which. See GE-0102.
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0007
  question: Does a country name in a mark always need a limitation?
  required_evidence:
  - TMM/Part29/9/9/3~1
  - TMM/Part29/9/9/3~2
  - TMM/Part29/9#1
  required_provisions:
  - TMA1995/s43
  required_cases:
  - CASE/1968/HCA/72
  - CASE/2003/ATMO/7
  qualifications_expected: That the answer is no, and that the criteria rather than the presence of the
    name decide it. That the Manual's examples are examples with stated reasons and not a rule. That an
    ambiguous or fanciful reference, or a word not seen as geographical, does not give rise to the ground.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0007
  notes: The cases are cited at citation level only. What the tribunal actually held is not held anywhere
    in the programme.
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0009
  question: How have the courts treated the difference between denotation and connotation?
  required_evidence:
  - TMM/Part29/2/2/1~1
  - TMM/Part29/2/2/1~2
  required_provisions:
  - TMA1995/s43
  required_cases:
  - CASE/2017/FCAFC/174
  - CASE/2010/ATMO/85
  qualifications_expected: That what is held is the Manual's quotation of the decisions, not the decisions.
    That the quotations are partial and edited by the Manual. That no decision text is available to check
    them against.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0005
  - PU-0015
  notes: PU-0015 is attached because a question of this shape is where an invented citation is most likely
    to appear — the answer wants more authority than the corpus holds.
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0010
  question: What does connotation mean for the purposes of section 43?
  required_evidence:
  - TMM/Part29/2/2/1~1
  - TMM/Part29/2/2/2
  required_provisions:
  - TMA1995/s43
  qualifications_expected: That the term is not defined in the Act. That the working meaning comes from
    ordinary dictionary definitions as expanded by decisions. That for section 43 the Manual gives it
    a wider meaning than the dictionary sense, including direct statements.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0004
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0011
  question: Two marks are similar and consumers may be confused. Is that section 43?
  required_evidence:
  - TMM/Part29/2/2/3
  - TMM/Part29/3/3/3
  required_provisions:
  - TMA1995/s43
  - TMA1995/s44
  required_cases:
  - CASE/2000/FCA/720
  qualifications_expected: 'That the answer is no, and why: a connotation must arise from the mark itself.
    That comparisons between marks are dealt with under section 44 and in Part 26. That the qualification
    "at least at the examination stage" is part of the rule.'
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0008
  - PU-0018
  notes: The highest-traffic wrong answer in the pilot. Both the question and the wrong answer use the
    corpus's most common words.
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0012
  question: Can other elements in the mark neutralise a problematic connotation?
  required_evidence:
  - TMM/Part29/3/3/5
  - TMM/Part29/9/9/3~1
  required_provisions:
  - TMA1995/s43
  required_cases:
  - CASE/2009/FCA/428
  qualifications_expected: That the mark as a whole is what is considered. That other features can diminish
    the impact rather than automatically cure it. That the Act contemplates a connotation arising from
    a sign contained in the mark, so the part and the whole are both operative.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0001
  approved_by: TC
  approved_date: '2026-09-02'
- id: GA-0013
  question: The mark contains letters that appear on the INN stem list. What follows?
  required_evidence:
  - TMM/Part29/5/5/5
  - TMM/Part29/5/5/6~1
  required_provisions:
  - TMA1995/s43
  required_cases:
  - CASE/2012/ATMO/117
  qualifications_expected: That membership of the list is not sufficient. That the stem must be included
    in a meaningful way, and that the Manual gives factors and counter-examples for when it is not. That
    the goods must be pharmaceutical or veterinary for the practice to engage at all.
  authority_distinction_required: true
  prohibited_conclusions:
  - PU-0009
  - PU-0001
  approved_by: TC
  approved_date: '2026-09-02'
