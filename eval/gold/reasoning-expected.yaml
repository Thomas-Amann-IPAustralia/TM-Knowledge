- id: GX-0010
  given:
  - GC-0031
  - TMM/Part29/7#1
  expected_inferences:
  - conclusion: Where a mark contains material likely to be viewed as a phoneword, the applicable practice
      turns on whether the applicant is the owner or authorised user, and the ground is reconsidered on
      information establishing that they are.
    basis:
    - TMM/Part29/7#1
    kind: classification
  must_not_infer:
  - PU-0001
  - PU-0002
  tier: 2
  explanation_required: true
  caveats: '"Likely to be viewed as a phoneword" is itself an evaluative judgement. The inference states
    the practice conditional on that judgement having been made by a person.'
  approved_by: TC
  approved_date: '2026-09-02'
