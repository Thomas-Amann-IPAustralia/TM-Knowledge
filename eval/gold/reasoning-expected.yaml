- id: GX-0001
  given:
  - TMM/Part29/1#1
  expected_inferences:
  - conclusion: The passage contains both quoted legislative text and the Registrar's practice, and the
      two must be distinguishable in any output derived from it.
    basis:
    - TMM/Part29/1#1
    - TMA1995/s43
    kind: classification
  must_not_infer:
  - PU-0004
  tier: 1
  explanation_required: true
  caveats: The chunk boundary is upstream's; the sentence boundary between the quotation and the practice
    guidance is not marked in the text.
  notes: Tier 1 on the view that this is structural. If deciding where the quotation ends is a reading
    rather than a parse, it is Tier 3.
  approved_by: TC
  approved_date: '2026-09-02'
- id: GX-0004
  given:
  - TMM/Part29/1#1
  - TMM/Part29/2/2/4
  expected_inferences:
  - conclusion: The Manual states both that the section's application is mandatory with no discretion
      to accept, and that where there is doubt a connotation exists the ground should not be raised. Both
      apply, at different points of the assessment.
    basis:
    - TMM/Part29/1#1
    - TMM/Part29/2/2/4
    kind: consistency
  must_not_infer:
  - PU-0001
  - PU-0007
  tier: 3
  explanation_required: true
  caveats: The clause "at different points of the assessment" is a reconciliation. If it is wrong, or
    if the two passages really do conflict, the conclusion should be rewritten or the whole record moved
    to prohibited-uses.
  notes: Low confidence and high value. This is the record most likely to be in the wrong file.
  approved_by: TC
  approved_date: '2026-09-02'
