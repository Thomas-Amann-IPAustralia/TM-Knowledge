- id: CQ-0001
  question: What guidance does the Manual give on when a ground for rejection under section 43 should
    be raised?
  asked_by: examiner
  category: retrieval
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/1#1
    supporting:
    - TMA1995/s43
    - TMM/Part29/2/2/4
    - TMM/Part29/3#1~1
  expected_concepts:
  - connotation
  - likely to deceive or cause confusion
  - ground for rejection
  answer_shape: Must state the statutory test in the words of s 43 and separately state the Manual's practice
    guidance, marked as practice rather than as law. Must convey that the section is mandatory in application
    while the threshold question — whether the decision maker is clearly satisfied — is an evaluative
    one.
  caveats: The Manual's own text quotes s 43 in full inside TMM/Part29/1#1, so an answer can appear to
    cite the Act while only having read the Manual. That is a grounding failure that will not show up
    as a missing source.
  measured_by:
  - expected_source_coverage
  - citation_correctness
  - authority_weighting
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0003
  question: My trade mark has a place name in it. Will that stop it being registered?
  asked_by: applicant
  category: retrieval
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/9#1
    - TMM/Part29/9/9/3~1
    supporting:
    - TMM/Part29/9/9/2
    - TMM/Part29/9/9/4
    - TMM/Part29/9/9/5
  expected_concepts:
  - geographical reference
  - geographical origin
  - condition of registration
  answer_shape: Must not answer yes or no. Must set out the criteria the Manual applies and state that
    the outcome depends on the specification and the surrounding circumstances, and must point to the
    route by which such a ground is overcome rather than leaving the applicant with a refusal.
  caveats: An answer that reads as advice on this applicant's mark has crossed from retrieval into an
    evaluative conclusion — see PU-0001.
  measured_by:
  - expected_source_coverage
  - grounding
  - prohibited_inferences
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0004
  question: Where a trade mark contains an INN stem, what does the Manual say about raising section 43
    alongside a ground under section 41 or section 44?
  asked_by: examiner
  category: retrieval
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/5/5/4
    supporting:
    - TMM/Part29/5/5/5
    - TMM/Part29/5/5/6~1
    - TMA1995/s41
    - TMA1995/s44
  expected_concepts:
  - International Non-Proprietary Name
  - INN stem
  - condition of registration
  answer_shape: Must state that the endorsement limiting use to goods containing the designated substance
    addresses the section 43 ground only, and must not imply that it disposes of a section 41 or section
    44 ground.
  caveats: The Manual states this negatively — "unlikely to assist in overcoming grounds… raised for other
    reasons". A summariser will drop the negation.
  measured_by:
  - expected_source_coverage
  - grounding
  - authority_weighting
  approved_by: TC
  approved_date: '2026-09-02'
- id: CQ-0005
  question: Where do I find the practice on celebrity names in trade marks?
  asked_by: examiner
  category: search
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/6#1~1
    - TMM/Part29/6#1~2
    supporting:
    - TMM/Part29/6/6/1
    - TMM/Part29/6/6/2~1
  expected_concepts:
  - well-known person
  - endorsement
  - written permission
  answer_shape: Must reach Part 29.6 from a term Part 29.6 never uses. Ranking the deceased-persons material
    above the general material would be a wrong ordering rather than a wrong answer.
  measured_by:
  - recall_at_10
  - mrr
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0006
  question: Can I register a brand that uses a famous sportsperson's name if they have signed off on it?
  asked_by: applicant
  category: search
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/6#1~2
    supporting:
    - TMM/Part29/6#1~1
  expected_concepts:
  - written permission
  - endorsement
  answer_shape: Must surface the permission route and the endorsement wording, and must make clear that
    the endorsement is the Registrar's suggested form of words rather than a statutory requirement.
  measured_by:
  - recall_at_10
  - authority_weighting
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0007
  question: Confusion between my mark and someone else's — which section is that?
  asked_by: applicant
  category: search
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/2/2/3
    supporting:
    - TMA1995/s44
    - TMM/Part29/3/3/3
  expected_concepts:
  - deceptively similar
  - connotation
  must_not_include:
  - TMM/Part29/3#1~2
  answer_shape: 'Must send the reader to section 44, and must say why section 43 is not the answer: a
    connotation arises from the mark itself, not from a comparison with another mark.'
  caveats: This is the highest-frequency false positive in the pilot area. An answer that lands anywhere
    in Part 29.3 is wrong in a way that reads entirely plausibly.
  measured_by:
  - precision_at_10
  - prohibited_inferences
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0008
  question: Is "-profen" on the restricted list?
  asked_by: examiner
  category: search
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/5/5/2
    supporting:
    - TMM/Part29/5/5/6~1
  expected_concepts:
  - INN stem
  answer_shape: Must distinguish the fact that a stem is listed from the conclusion that a ground arises,
    because the Manual makes the second turn on whether the stem appears in the mark in a meaningful way.
  caveats: The annex chunks carry no sentence context at all, so a retrieval system can return a correct
    hit that tells the reader nothing.
  measured_by:
  - recall_at_10
  - grounding
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0009
  question: What has to be established before a standalone geographical reference in a trade mark is treated
    as likely to cause confusion?
  asked_by: examiner
  category: reasoning
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/9/9/3~1
    supporting:
    - TMM/Part29/9#1
    - TMM/Part29/9/9/4
  expected_concepts:
  - geographical reference
  - surrounding circumstances
  - average consumer
  answer_shape: Must present the criteria as a set that must all be met, must include the mitigating-elements
    criterion, and must not compress them into a single likelihood judgement.
  measured_by:
  - expected_inferences_produced
  - explanation_completeness
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0010
  question: Why was no section 43 ground raised for BALI on bras, when one was raised for SHETLAND on
    clothing?
  asked_by: examiner
  category: reasoning
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/9/9/3~1
    supporting:
    - TMM/Part29/9/9/3~2
  expected_concepts:
  - reputation
  - geographical origin
  - purchasing decision
  answer_shape: Must attribute the difference to the reasons the Manual gives, and must not offer a general
    rule about place names that the Manual does not state.
  caveats: Both examples are stated in the Manual with their outcomes. Answering from the citations alone
    is impossible — no decision text exists in the programme (Q-11).
  measured_by:
  - grounding
  - explanation_completeness
  - prohibited_inferences
  approved_by: TC
  approved_date: '2026-08-20'
- id: CQ-0011
  question: Does a descriptive term inside a trade mark trigger section 43 on its own?
  asked_by: examiner
  category: reasoning
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/4#1
    - TMM/Part29/3#1~1
    supporting:
    - TMM/Part29/2/2/1~1
  expected_concepts:
  - descriptive matter
  - real and tangible danger
  - specification
  answer_shape: Must answer in the negative and state the condition under which it does arise — a connotation
    directly contradicted by the specification. Must keep the two worked PLATYPUS examples distinguishable
    rather than merging them.
  measured_by:
  - expected_inferences_produced
  - grounding
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0012
  question: Is the connotation in this trade mark strong enough to warrant a ground for rejection?
  asked_by: examiner
  category: reasoning
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/2/2/4
    - TMM/Part29/3#1~2
    supporting:
    - TMM/Part29/1#1
  expected_concepts:
  - presumption of registrability
  - obvious, direct and immediate
  answer_shape: Must decline to reach the conclusion, must state the considerations the Manual says bear
    on it, and must surface the presumption of registrability — that where there is doubt a connotation
    exists, the ground should not be raised.
  caveats: This question is deliberately one the system must not answer. It is bounded by PU-0001 and
    PU-0004.
  measured_by:
  - prohibited_inferences
  - explanation_completeness
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0015
  question: At what point in time is the marketplace assessed when deciding whether a sign is likely to
    deceive or cause confusion?
  asked_by: examiner
  category: currency
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/3/3/2
    supporting:
    - TMM/Part29/3/3/4
    - TMM/Part29/6#1~2
  expected_concepts:
  - current marketplace
  - priority date
  answer_shape: Must keep the currency of the Manual text and the currency of the market separate, and
    must not present one as evidence about the other.
  caveats: 29.6 asks how well known a person is "as at the priority date", while 29.3.2 asks about the
    current marketplace. Whether those are the same moment is a legal reading, not a drafting inconsistency
    to be smoothed over.
  measured_by:
  - currency
  - expected_source_coverage
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0017
  question: If section 43 were amended, which parts of the Manual would need reviewing?
  asked_by: maintainer
  category: impact
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/1#1
    - TMM/Part32A/2/4/2/4/1
    - TMM/Part32B/2/2#1
    supporting:
    - TMM/Part20/5/5/5
    - TMM/Part12/2#1
    - TMM/Part34/5/5/2
  expected_concepts:
  - ground for rejection
  answer_shape: Must reach beyond Part 29 into the Parts that apply s 43 to particular subject matter,
    and must distinguish material that states the ground from material that merely mentions it in a list.
  caveats: Of the chunks citing the provision, some carry the edge only because upstream read a bare "section
    43" out of prose and resolved it by convention. Those are inferences, not IP Australia's assertions
    (Q-07).
  measured_by:
  - impact_analysis_coverage
  - precision_at_10
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0018
  question: The WHO has notified a new International Non-Proprietary Name. What in our practice material
    is affected?
  asked_by: maintainer
  category: impact
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/5/5/1
    - TMM/Part29/5/5/4
    supporting:
    - TMM/Part29/5/5/3
    - TMM/Part29/5/5/5
  expected_concepts:
  - International Non-Proprietary Name
  - INN stem
  answer_shape: Must identify that the practice depends on an externally maintained list rather than on
    the Manual's own text, and must name the annex as a derived artefact that goes stale silently.
  measured_by:
  - impact_analysis_coverage
  - explanation_completeness
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0019
  question: If the practice on connotation in Part 29.2 changed, what else would have to change with it?
  asked_by: maintainer
  category: impact
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/2/2/1~1
    - TMM/Part29/3#1~1
    supporting:
    - TMM/Part29/2/2/2
    - TMM/Part29/2/2/3
    - TMM/Part29/9/9/3~1
    - TMM/Part32A/2/4/2/4/1
  expected_concepts:
  - connotation
  - denotation
  answer_shape: Must trace the dependency through passages that use the concept without citing the passage
    that defines it, and must not limit itself to passages that link.
  caveats: Unresolvable internal references are dropped upstream rather than recorded (Q-08), so the absence
    of a link is not evidence of the absence of a dependency.
  measured_by:
  - impact_analysis_coverage
  - relation_recall
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0020
  question: Which citations in the section 43 material point at legislation we do not hold?
  asked_by: maintainer
  category: impact
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/3/3/1~2
    supporting: []
  expected_concepts:
  - superseded legislation
  answer_shape: Must name the citation and the instrument, must state that the instrument is not held,
    and must not silently omit the citation from a list of authorities.
  caveats: Q-24. Only two instruments are held, so every citation to an earlier Act is unresolvable by
    construction rather than by error.
  measured_by:
  - citation_correctness
  - impact_analysis_coverage
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0021
  question: Which exact passage does that statement come from, and is it the Act or the Manual?
  asked_by: examiner
  category: provenance
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/1#1
    - TMA1995/s43
    supporting: []
  answer_shape: Must give a passage-level citation, not a Part-level one, and must label each cited passage
    by authority type. An answer that cites "Part 29" has not answered.
  caveats: TMM/Part29/1#1 quotes s 43 in full, so a system can satisfy a citation check while never having
    opened the legislation.
  measured_by:
  - citation_correctness
  - authority_weighting
  - grounding
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0022
  question: Did the Manual's authors link that section themselves, or did we work it out from the wording?
  asked_by: maintainer
  category: provenance
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/10#1
    - TMM/Part29/1#1
    supporting: []
  answer_shape: Must report the extraction method and, where the citation was inferred, the certainty
    attached to it — and must not present a `default` resolution as though IP Australia had named the
    instrument.
  caveats: TMM/Part29/1#1 carries an authored link; TMM/Part29/10#1 carries a bare "s43" resolved by convention.
    The pair is the test.
  measured_by:
  - citation_correctness
  - provenance_fidelity
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0023
  question: Which decisions does the Manual rely on for the proposition that a connotation must arise
    from the mark itself?
  asked_by: examiner
  category: provenance
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/3/3/3
    supporting:
    - TMM/Part29/2/2/3
  expected_concepts:
  - connotation
  answer_shape: Must list the decisions at citation level and must state that the holdings are not held,
    rather than paraphrasing what the courts decided from the Manual's summary of them.
  caveats: The Manual's own characterisation of a decision is Manual text. Repeating it as though it were
    the decision is an authority conflation — PU-0002.
  measured_by:
  - citation_correctness
  - grounding
  - prohibited_inferences
  approved_by: TC
  approved_date: '2026-08-25'
- id: CQ-0024
  question: Is that a requirement, or is it how we usually do it?
  asked_by: examiner
  category: provenance
  pilot_in_scope: true
  expected_sources:
    required:
    - TMM/Part29/1#1
    - TMM/Part29/5/5/4
    supporting:
    - TMA1995/s43
    - TMM/Part29/6#1~2
  expected_concepts:
  - endorsement
  - condition of registration
  answer_shape: Must separate what the Act requires from what the Manual records as practice, including
    for the suggested endorsement wording, which is the Registrar's suggestion rather than a prescribed
    form.
  caveats: The Manual states practice; it does not bind the Registrar's discretion and it is not legislation
    (Q-12). Every answer in the pilot has to keep that visible, and this question tests it directly.
  measured_by:
  - authority_weighting
  - citation_correctness
  approved_by: TC
  approved_date: '2026-08-25'
