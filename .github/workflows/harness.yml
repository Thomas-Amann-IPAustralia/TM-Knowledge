# The Stage 0 harness, on every push (parallel track P11, ADR-0018).
#
# The design problem this file exists to solve: **this repo's harness is
# supposed to fail.** Stage 0 has no expert content, so the completeness gate
# is red by design and will stay red for weeks. A permanently red pipeline
# trains everyone to ignore it, and that is exactly when a real regression slips
# through.
#
# So the two signals are separated, and the separation is the whole file:
#
# - **Stage 0 incompleteness is a reported state.** `--allow-incomplete` maps
#   the harness's exit 3 to 0, and the gap list is written to the run summary,
#   where it reads as a status report rather than as a broken build.
# - **A malformed record, an unresolvable ref, a span that does not land, a
#   stale hash or a dropped `certainty` is a genuine failure.** Those exit 1 and
#   break the build.
#
# The last job is what keeps the green badge worth anything: it runs the harness
# over a deliberately corrupted gold set and fails if the harness *passes* it.

name: harness

on:
  push:
  pull_request:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      # The snapshot is not in git (ADR-0004) and upstream may be private, so
      # this is best-effort. When it fails the corpus-wide and resolution checks
      # skip and say so; they never silently pass. `UPSTREAM_TOKEN` is optional:
      # set it if upstream is private, leave it unset if it is not.
      - name: Fetch the pinned upstream snapshot
        id: snapshot
        continue-on-error: true
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          if [ -n "${UPSTREAM_TOKEN}" ]; then
            git config --global \
              url."https://x-access-token:${UPSTREAM_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi
          tmk-fetch-upstream

      - name: Report whether the snapshot is present
        run: |
          if [ -d data/upstream ]; then
            echo "Snapshot present — resolution checks will run." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ No snapshot"
              echo
              echo "The pinned snapshot could not be fetched, so every check that"
              echo "needs the corpus **skipped**. Nothing below verified a ref, a"
              echo "span or a content hash."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Genuine failures. Anything red here is a defect in code or in data.
      - name: Tests
        run: pytest -q

      # The reported state. Exit 3 (Stage 0 incomplete) is forgiven; exit 1
      # (something that arrived is wrong) is not.
      - name: Stage 0 harness
        run: tmk-harness --allow-incomplete

      - name: Stage 0 coverage report
        if: always()
        run: |
          tmk-coverage --out data/derived/reports/coverage.md || true
          {
            echo
            echo "---"
            echo
            cat data/derived/reports/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The other half of the status report: coverage says what Stage 0 is
      # missing, this says whose decision moves it (ADR-0053). It is also a
      # check the harness cannot make -- the harness only reads eval/gold/, so
      # a seed record naming an id that exists nowhere is invisible to it, and
      # `tmk-blockers` exits 1 on one. That is a defect, not a gap: the id was
      # constructed rather than read.
      - name: Stage 0 blocker report
        run: |
          tmk-blockers --out data/derived/reports/blockers.md
          {
            echo
            echo "---"
            echo
            cat data/derived/reports/blockers.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The dashboard restates committed artefacts. If a record moved and the
      # site data was not regenerated, the published page is showing a number
      # this repository no longer holds -- which is worse than showing none.
      - name: The published dashboard matches the repository
        run: |
          pip install -e ".[rdf]"
          tmk-dashboard --check

      - name: Publish the status reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-reports
          path: |
            data/derived/reports/coverage.md
            data/derived/reports/blockers.md
          if-no-files-found: warn

  # Stages 5, 6 and 9: the ontology draft, the graph built under it, and the
  # SHACL gate. Separate job because it needs the snapshot to say anything at
  # all -- without the corpus there is no source graph, so a "pass" here would
  # mean the checks did not run rather than that they passed.
  #
  # The severities are the harness's (ADR-0030), so the same rule applies: a
  # defect breaks the build, a gap is a reported state. Unlike Stage 0, the
  # graph currently has neither -- so `tmk-shacl` is expected to exit 0, and if
  # it stops doing so, something in the approved content or the model moved.
  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test,rdf]"

      - name: Fetch the pinned upstream snapshot
        id: snapshot
        continue-on-error: true
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          if [ -n "${UPSTREAM_TOKEN}" ]; then
            git config --global \
              url."https://x-access-token:${UPSTREAM_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi
          tmk-fetch-upstream

      # The generated dictionary must match a regeneration. A hand-edit to
      # relations.ttl would be an agent choosing the vocabulary (rule 1), and
      # this is where that gets caught rather than reviewed.
      - name: The relation dictionary is not hand-edited
        run: tmk-ontology-relations

      - name: Halt if the snapshot is missing
        if: steps.snapshot.outcome != 'success'
        run: |
          {
            echo "### ⚠️ Ontology checks skipped"
            echo
            echo "No snapshot, so there is no source graph to build or validate."
            echo "Nothing below ran. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Build the graph
        run: tmk-graph --rules

      # The whole graph is committed now (ADR-0070), which is only worth
      # anything if what is committed is what a build produces. A stale
      # approved.ttl read without rebuilding is a confident answer from data
      # this repository has moved past.
      - name: The committed graph matches a rebuild
        run: tmk-graph --rules --check

      # The publication gate. Exit 1 is a defect and breaks the build; exit 3
      # would be a gap. Today it is 0.
      - name: SHACL gate
        run: tmk-shacl --rules

      - name: Answer the competency questions
        if: always()
        run: |
          tmk-ask > /tmp/answers.txt || true
          {
            echo
            echo "---"
            echo
            echo "<details><summary>Competency question answers</summary>"
            echo
            echo '```'
            cat /tmp/answers.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ontology status report
        if: always()
        run: |
          tmk-ontology-report --write
          {
            echo
            echo "---"
            echo
            cat data/derived/reports/ontology.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the ontology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-report
          path: data/derived/reports/ontology.md
          if-no-files-found: warn

  # The canary. A harness that has quietly stopped checking would leave every
  # job above green, which is indistinguishable from a healthy repo. This fails
  # the build if the harness accepts a gold set that is broken on purpose.
  still-goes-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      # No snapshot: the structural defects in the fixture are enough to exit 1,
      # and this job must not depend on reaching a private upstream.
      - name: The harness must reject a deliberately corrupted gold set
        run: |
          set +e
          tmk-harness \
            --gold-dir tests/fixtures/harness/defective \
            --no-resolution --allow-incomplete
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::the harness exited ${code} on a gold set corrupted on purpose; it must exit 1"
            exit 1
          fi
          echo "The harness still rejects a corrupted gold set." >> "$GITHUB_STEP_SUMMARY"

      # The same canary for the other store. `authored/` is empty today, so
      # every authored check would iterate nothing and pass — which is exactly
      # the vacuous green ADR-0018 exists to prevent, and it would stay vacuous
      # right up until the first real record was written. The gold set is the
      # sound fixture here, so the only thing that can make this exit 1 is the
      # authored store.
      - name: The harness must reject a deliberately corrupted authored store
        run: |
          set +e
          tmk-harness \
            --gold-dir tests/fixtures/harness/sound \
            --authored-dir tests/fixtures/authored/defective \
            --no-resolution --allow-incomplete
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::the harness exited ${code} on an authored store corrupted on purpose; it must exit 1"
            exit 1
          fi
          echo "The harness still rejects a corrupted authored store." >> "$GITHUB_STEP_SUMMARY"
