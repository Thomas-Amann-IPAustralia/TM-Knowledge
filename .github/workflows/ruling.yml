# The other half of the dashboard: an answer coming back in.
#
# The dashboard is a static page and cannot write to this repository — a page
# that could would need a credential sitting in a browser. So the form composes
# a GitHub issue, the owner submits it, and this workflow transcribes it into
# `review/rulings/` where the next session reads it.
#
# The issue is the artefact and stays untouched. The YAML file is a
# transcription and says on its face which issue it came from — the same split
# `review/returned/` and `review/decisions/` already draw (ADR-0050).
#
# Two things this workflow refuses to do. It will not transcribe a submission
# from someone without write access to this repository — the answers become
# repository content, so the person answering must be someone who could have
# committed them anyway. And it will not guess: a submission naming a question
# or an option that does not exist is reported on the issue and nothing is
# written (CLAUDE.md rule 6).

name: ruling

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: ruling-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  transcribe:
    if: contains(github.event.issue.body, '<!-- tmk-ruling:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a submission from outside the repository
        if: >
          github.event.issue.author_association != 'OWNER' &&
          github.event.issue.author_association != 'MEMBER' &&
          github.event.issue.author_association != 'COLLABORATOR'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          WHO: ${{ github.event.issue.author_association }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thanks — this looks like a dashboard submission, but it came from an account without write access to this repository (\`$WHO\`), so nothing has been written. A decision recorded here becomes repository content, so it has to come from someone who could have committed it directly.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          echo "::notice::submission from ${WHO} left as an issue only"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Write the issue body to a file
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue-body.md

      - name: Transcribe it
        id: transcribe
        env:
          NUMBER: ${{ github.event.issue.number }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set +e
          tmk-ruling --body /tmp/issue-body.md \
            --issue-number "$NUMBER" --issue-url "$URL" \
            --author "$AUTHOR" --title "$TITLE" --write \
            > /tmp/ruling.out 2> /tmp/ruling.err
          code=$?
          set -e
          cat /tmp/ruling.out /tmp/ruling.err
          {
            echo "code=${code}"
            echo "file=$(sed -n 's/^wrote //p' /tmp/ruling.out | head -1)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Ruling from issue #${NUMBER}"
            echo
            echo '```'
            cat /tmp/ruling.out /tmp/ruling.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Two different failures, and telling the owner the wrong one wastes their
      # time. `tmk-ruling` prints `refused:` when the *submission* is the problem
      # — an unknown question, an option that is not on the form — and that is
      # the one re-submitting fixes. Anything else is this repository failing to
      # run, and on 2026-09-08 the old wording told the owner their submission
      # was malformed when in fact a dependency was missing (Q-39, ADR-0067).
      - name: Report a refusal on the issue, and stop
        if: steps.transcribe.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "I could not record this submission, so **nothing has been written**."
            echo "Your answers are safe — this issue is the record of them, and it is untouched."
            echo
            echo '```'
            cat /tmp/ruling.err
            echo '```'
            echo
            if grep -q '^refused:' /tmp/ruling.err; then
              echo "That is a problem with the submission itself: the answer block was edited"
              echo "by hand, or the questions changed after the form was opened. Re-opening the"
              echo "dashboard and submitting again will fix both."
            else
              echo "**That is not something you did.** The transcription tool failed to run at"
              echo "all, which is a fault in this repository and not in your answers. Nothing"
              echo "is lost and re-submitting will not help. A working session will fix the"
              echo "tool and transcribe this issue as it stands."
              echo
              echo "[The failed run]($RUN)."
            fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/comment.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          exit 1

      - name: Commit it
        id: commit
        env:
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/rulings
          if git diff --cached --quiet; then
            echo "nothing changed — the same answers were already recorded"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Record the owner's ruling from issue #${NUMBER}

          Transcribed by tmk-ruling from the dashboard submission by @${AUTHOR}.
          The issue is the artefact; this file is the transcription."
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((attempt * 2))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm on the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          FILE: ${{ steps.transcribe.outputs.file }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "Recorded. Your answers are now in the repository at"
            echo "[\`${FILE}\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/${FILE})."
            echo
            cat /tmp/ruling.out
            echo
            echo "The next working session reads \`review/rulings/\` before it does anything"
            echo "else, acts on what you decided, and fills in the \`applied:\` line in that"
            echo "file to say what it did. Nothing else has changed yet."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/done.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/done.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
