# The queue of decisions waiting on a person.
#
# This is the file a session edits to put something in front of the owner. It is
# rendered as the "Your decisions" form on the dashboard, and an answer comes
# back as a file in `review/rulings/`.
#
# Writing a good entry is the whole job. Assume the reader has not read the repo
# and does not want to. Say what is going on, why only they can settle it, and
# what stays stuck until they do. No acronym survives without being unpacked in
# place. `review/questions/README.md` has the house style; `schema.json` enforces
# the parts a machine can check.

version: 1
updated: '2026-09-08'

themes:
  - id: unblocks
    title: Decisions that unblock the next piece of work
    blurb: >
      Things nothing can move past. Each is a judgement call, not a research
      task — if you have a view, that view is the answer.
  - id: scope
    title: Scope and permissions
    blurb: >
      Questions about what this project is allowed to do and how far it reaches.
      Some need an answer from elsewhere in the agency; you are the one who can
      go and get it.
  - id: confirm
    title: Calls made so work could continue
    blurb: >
      Judgements an agent made rather than stopping. Each one is provisional
      until you look at it. Leaving a box unticked confirms it — you do not have
      to agree with reasons you have not read.
  - id: expert
    title: Waiting on a trade marks expert
    blurb: >
      Paused at your instruction, not abandoned. These are questions about trade
      marks law and practice, and nothing here — you, or an agent — should answer
      them from general knowledge. Shown so nothing quietly disappears.

questions:

  # ---------------------------------------------------------------- unblocks

  - id: OQ-0001
    theme: unblocks
    status: answered
    # Answered 2026-09-08 (issue #12): use the four groups. The pass is OQ-0020.
    needs: owner
    urgency: high
    raised: S010
    tracked_as: ['HANDOFF §2 ruling 1', 'ADR-0056']
    title: Are these four groups the right way to sort the 52 legal ideas?
    plain: >
      We hold 52 ideas drawn from the section 43 material — connotation, likely to
      deceive or cause confusion, goods of a particular geographical origin, and
      49 more. They currently sit in one flat list. The draft model proposes
      sorting each one into one of four groups: a ground of refusal (a reason an
      application can be refused), a legal test (a question the decision maker has
      to answer), a relevant factor (something that feeds into that answer), or an
      exception (something that takes a case out of the rule). Those four groups
      exist in the model and every one of them is empty.
    why_you: >
      Deciding that "connotation" is a test rather than a factor is a legal
      judgement. An agent filling those groups would produce a taxonomy that reads
      as authoritative and was written by nobody. You said you were willing to make
      calls like this one; it is the single largest gap in the draft.
    if_unanswered: >
      The vocabulary stays a flat list. Search and retrieval later have nothing to
      generalise over — no way to ask "show me every relevant factor" — and 39 of
      the 52 also sit outside any hierarchy, so the list is close to unstructured.
    background:
      - label: What the draft cannot do — the generated report, section 5
        href: '#/reports?open=ontology'
      - label: The 52 ideas, as they stand now
        href: '#/vocabulary'
    answer:
      kind: choice
      prompt: What should happen to the four groups?
      options:
        - value: four_groups_right
          label: Use those four groups — come back to me with the list of 52 to sort
          help: >
            The next session builds somewhere to record the sorting and returns
            with the 52 as a single pass of dropdowns.
        - value: different_groups
          label: The idea is right but the groups are wrong — I will describe better ones
          help: Say what the groups should be in the notes box.
        - value: not_a_taxonomy
          label: Do not sort them — a flat list is honest for now
          help: >
            The empty groups come out of the model and the gap stops being
            reported as a gap.
        - value: need_examples
          label: Show me five worked examples first, then ask me again
          help: >
            A session picks five concepts, proposes a group for each with the
            passage it read, and marks all of it unapproved.
    notes_prompt: Anything that would change the answer, or a group you would add.

  - id: OQ-0002
    theme: unblocks
    status: answered
    # Answered 2026-09-08 (issue #12): section 44, and CQ-0007 is naming a boundary.
    needs: owner
    urgency: high
    raised: S010
    tracked_as: ['Q-37', 'HANDOFF §2 ruling 2']
    title: '"Deceptively similar" — a section 43 idea, or a section 44 one?'
    plain: >
      Two approved records disagree. One of the test questions we measure the
      system against expects a good answer about confusion to mention "deceptively
      similar". The vocabulary record for "likely to deceive or cause confusion"
      lists "deceptively similar" as a term that specifically does *not* mean the
      same thing — on the reading that it belongs to the section 44 comparison
      between two traders' marks, not to the section 43 question about what a mark
      says to the public. Both records were signed off. They cannot both stand as
      written.
    why_you: >
      Which of the two is wrong is a question about trade marks law. An agent
      resolving it either invents a concept or edits an expert's approved record,
      and both are out of bounds.
    if_unanswered: >
      One approved test question keeps naming a term the vocabulary deliberately
      excludes. Any measurement that uses that question will report a miss that
      is not a miss.
    background:
      - label: The vocabulary record and its not-labels
        href: '#/vocabulary?open=GC-0002'
      - label: The test question
        href: '#/questions?open=CQ-0007'
    answer:
      kind: choice
      prompt: Which way does it go?
      options:
        - value: not_in_scope
          label: It belongs to section 44 — keep it out, the question is using it as a boundary marker
        - value: add_concept
          label: Add it to the vocabulary as its own concept, even though it is a section 44 idea
        - value: change_question
          label: Change the test question so it no longer expects that term
        - value: ask_expert
          label: Hold it for the trade marks expert
    notes_prompt: If you picked "add it", say what it should be recorded as meaning.

  - id: OQ-0003
    theme: unblocks
    status: answered
    # Answered 2026-09-08 (issue #12): show me first. The pack exists; re-asked as OQ-0019.
    needs: owner
    urgency: high
    raised: S010
    tracked_as: ['RULE-0001', 'HANDOFF §2 ruling 3']
    title: 'Approve or reject the first automatic rule: the mixed-authority flag'
    plain: >
      A rule here is a small, fixed instruction that adds a labelled note to the
      data — not a model, and not anything that changes over time. This one finds
      passages that quote the Act and state IP Australia's own practice in the same
      breath, and flags them. It matters because an answer drawn from such a
      passage can look like it is quoting the law when it has only read the Manual.
      It flags five passages out of the 216 in scope, and it does find the main
      section 43 passage, where the Manual quotes the section in full. (This question
      originally said 71. That was the number of rows of data the rule writes, not the
      number of passages it flags — see OQ-0019.) Nothing it produces is trusted today:
      every flag is stored as "candidate — needs a human".
    why_you: >
      The programme requires a person to approve every reasoning template before
      it is used. Nobody has, so its output stays quarantined however well it
      works.
    if_unanswered: >
      The flags exist and nothing may rely on them. Any later feature that would
      warn "this passage mixes law and practice" cannot be built on a rule that is
      still pending.
    background:
      - label: What the rule does and what it stands on
        href: '#/graph'
    answer:
      kind: choice
      prompt: What is your call on RULE-0001?
      options:
        - value: approve
          label: Approve it — its flags may be relied on
        - value: approve_pending_expert
          label: Approve it for now, with a trade marks expert to confirm later
        - value: reject
          label: Reject it — delete the rule
        - value: show_me
          label: Show me the flagged passages first
    notes_prompt: Optional.

  - id: OQ-0004
    theme: unblocks
    status: answered
    # Answered 2026-09-08 (issue #12): approved.
    needs: owner
    urgency: high
    raised: S010
    tracked_as: ['RULE-0002', 'HANDOFF §2 ruling 3']
    title: 'Approve or reject the second automatic rule: the change-impact links'
    plain: >
      The second rule answers "if this passage changed, what else would have to be
      looked at?" It follows two kinds of link — the ones the Manual's authors
      wrote themselves, and the ones that were worked out from the wording — and it
      keeps them distinguishable, which matters because a whole Part of the Manual
      can be pulled into an impact list purely by inferred links. It draws 187 links.
      (This question originally said 2,244. That was the number of rows of data the
      rule writes, not the number of links — see OQ-0019.) Same status as the first at
      the time of asking: everything it produced was marked "candidate — needs a human".
    why_you: >
      Same reason as the first rule. It is also the one most likely to be used to
      say "these parts of the Manual need reviewing", which is a claim someone will
      act on.
    if_unanswered: >
      Impact analysis stays a demonstration. It cannot be quoted to anyone as a
      basis for planning a review.
    background:
      - label: What the rule does and what it stands on
        href: '#/graph'
    answer:
      kind: choice
      prompt: What is your call on RULE-0002?
      options:
        - value: approve
          label: Approve it — its links may be relied on
        - value: approve_pending_expert
          label: Approve it for now, with a trade marks expert to confirm later
        - value: reject
          label: Reject it — delete the rule
        - value: show_me
          label: Show me a worked example first
    notes_prompt: Optional.

  - id: OQ-0005
    theme: unblocks
    status: answered
    # Answered 2026-09-08 (issue #12): commit everything.
    needs: owner
    urgency: medium
    raised: S010
    tracked_as: ['ADR-0060', 'HANDOFF Q23']
    title: Should the large generated data files be stored in the repository?
    plain: >
      The graph is built into four files. Two are stored in Git and two are not.
      The two that are stored are this project's own decisions written out as data,
      about 290KB. The two that are not are a restatement of the upstream corpus —
      about 6.5MB, rebuilt from scratch in a few seconds — and storing those would
      mean carrying a copy of another repository's content in this one's history
      permanently.
    why_you: >
      It is a trade-off with no technically correct answer. Leaving them out keeps
      the history clean; putting them in means someone can review the graph without
      building anything first.
    if_unanswered: >
      Nothing is blocked. It is one line of configuration either way, and the
      question exists so the choice is yours rather than an agent's.
    answer:
      kind: choice
      prompt: How should it be?
      options:
        - value: keep_as_is
          label: Leave it — store our own decisions, rebuild the rest
        - value: commit_everything
          label: Store everything, so the graph can be read without building it
        - value: no_view
          label: I have no view — use your judgement and stop asking
    notes_prompt: Optional.

  - id: OQ-0006
    theme: unblocks
    status: open
    needs: owner
    urgency: medium
    raised: S010
    tracked_as: ['ADR-0061', 'HANDOFF Q24']
    title: Should a saved question be refused unless it says what it cannot answer?
    plain: >
      Each question the system can answer is stored as a small saved query. A rule
      was introduced: a query is refused unless it carries a line saying what it
      does *not* establish. The reason is that a query returning a neat table
      always looks like an answer, even when it measured something narrower than
      the question asked. One of ours counts which parts of the Manual cite section
      43 — which is not the same as which parts would need changing if section 43
      changed, though it reads that way. The cost is that writing a query takes
      longer, and the extra time goes on writing down what it does not prove.
    why_you: >
      The rule was an agent's reading of what the project's own standard implies
      rather than what it says. It should be your call before more queries are
      written against it.
    if_unanswered: >
      Nothing is blocked. Every query written from here carries the requirement
      unless you say otherwise.
    answer:
      kind: choice
      prompt: Keep the rule?
      options:
        - value: keep_rule
          label: Keep it — a query with no stated limits is refused
        - value: soften_rule
          label: Require the line, but warn rather than refuse
        - value: drop_rule
          label: Drop it — it is overhead
    notes_prompt: Optional.

  # ------------------------------------------------------------------- scope

  - id: OQ-0007
    theme: scope
    status: answered
    answered:
      date: '2026-09-08'
      how: >-
        Answered in chat the same day it became a blocker: Gemini 3.8 Flash, with
        the key added as a repository secret. The second half of the question —
        the agency's data-handling conditions for sending Manual text to a
        third-party service — is recorded as outstanding rather than assumed.
      record: docs/DECISIONS.md
      applied: true
    # Escalated 2026-09-08 (ADR-0083). This was a question nothing waited on.
    # Stages 2-4 are now open, so model-backed extraction over Manual text is
    # blocked on it for the first time. Deterministic extraction proceeds without
    # an answer; anything sending Manual text to a model does not.
    needs: owner
    urgency: high
    raised: S001
    tracked_as: ['HANDOFF Q3']
    title: Which AI model may we use, and may Manual text be sent to it?
    plain: >
      Later stages want to use a language model to propose candidate terms and
      relationships from Manual text — always as suggestions a person checks, never
      as final answers. Before any of that runs we need to know which model the
      agency permits and whether Manual text may leave our systems to reach it.
      Everything built so far avoids the question deliberately: records carry no
      model name rather than one that might turn out to be off-limits.
    why_you: >
      It is an agency policy question, and you are the person who can go and get
      the answer.
    if_unanswered: >
      Three of the eleven stages cannot start. Nothing already built is affected —
      the ontology, the graph and the checks all run without a model.
    answer:
      kind: choice
      prompt: Where does this stand?
      options:
        - value: named_model
          label: There is an approved model — I will name it in the notes
        - value: none_yet
          label: Nothing is approved yet — keep avoiding the question
        - value: finding_out
          label: I am asking — do not wait on me
        - value: no_external
          label: No text may leave our network at all
    notes_prompt: The model, the conditions, or who you have asked.

  - id: OQ-0008
    theme: scope
    status: open
    needs: owner
    urgency: low
    raised: S001
    tracked_as: ['HANDOFF Q7', 'docs/IDENTIFIERS.md §2']
    title: What web address may this project's data use as its permanent name?
    plain: >
      Every item in the graph needs a globally unique name, and by convention that
      name is written as a web address — for example
      https://data.ipaustralia.gov.au/tmk/concept/GC-0001. It does not have to open
      a real page, but it should be an address the agency genuinely controls,
      because changing it later means rewriting every stored name. We use that
      address as a placeholder today. It is held in exactly one setting, so
      switching it is a one-line change and a rebuild.
    why_you: >
      Who controls a gov.au address is an organisational fact, not a technical one.
    if_unanswered: >
      Nothing is blocked. The placeholder works; it simply should not be the
      published answer.
    answer:
      kind: choice
      prompt: What should the base address be?
      options:
        - value: use_proposed
          label: The proposed one is fine — data.ipaustralia.gov.au/tmk/
        - value: different
          label: Use a different one — I will give it in the notes
        - value: dont_know_yet
          label: Nobody has decided — keep the placeholder and flag it
    notes_prompt: The address, if you have one.

  - id: OQ-0009
    theme: scope
    status: answered
    # Answered 2026-09-08 (issue #12): in scope, from IP-Decision-Data. Follow-on is OQ-0018.
    needs: owner
    urgency: low
    raised: S001
    tracked_as: ['HANDOFF Q6', 'Q-11']
    title: Should we obtain the actual court decisions the Manual cites?
    plain: >
      The section 43 material names 58 distinct court decisions. We hold the
      citations — case name, year, court — but not a word of what any court
      actually said, and nothing in the plan acquires them. The consequence is
      permanent and worth stating plainly: "which cases interpret this test" is
      answerable, and "what did the court hold" is not.
    why_you: >
      It is a scope and possibly a licensing decision, and it changes what the
      finished system can honestly claim to do.
    if_unanswered: >
      Nothing is blocked. The limitation is recorded, and a prohibition already
      exists to stop the system pretending otherwise.
    answer:
      kind: choice
      prompt: Where do the decision texts sit?
      options:
        - value: out_of_scope
          label: Out of scope — citations only, and say so plainly
        - value: in_scope_later
          label: In scope, but later — not for the pilot
        - value: investigate
          label: Find out what we may lawfully hold, then ask me again
    notes_prompt: Optional.

  - id: OQ-0010
    theme: scope
    status: answered
    # Answered 2026-09-08 (issue #12): keep it as it is.
    needs: owner
    urgency: low
    raised: S001
    tracked_as: ['HANDOFF Q4', 'ADR-0039']
    title: Who may sign knowledge off as approved?
    plain: >
      Every approved record carries a name and a date, and that pair *is* the
      approval — there is no separate sign-off document. So far every name in the
      files is the same reviewer's initials. As more people review, we need to know
      who may sign. There is a second half to it: you chose that your own approvals
      should look exactly like a trade marks expert's, with no separate marker. It
      is worth confirming now you have seen it written down, because once a record
      is signed the two become indistinguishable.
    why_you: >
      Who may approve knowledge on behalf of the agency is not an agent's call.
    if_unanswered: >
      Nothing is blocked today. It becomes a real problem the first time two
      people disagree and the record cannot say who signed which half.
    answer:
      kind: choice
      prompt: How should approvals be attributed?
      options:
        - value: same_as_expert
          label: Keep it as it is — my approvals look the same as an expert's
        - value: mark_owner_separately
          label: Mark mine differently, so the two can be told apart later
        - value: list_of_approvers
          label: There is a list of people who may sign — I will name them
    notes_prompt: Names, roles, or the rule you want applied.

  - id: OQ-0011
    theme: scope
    status: open
    needs: owner
    urgency: low
    raised: S006
    tracked_as: ['HANDOFF Q14']
    title: Who is the plain-English guide to building an ontology for?
    plain: >
      You asked for more guidance on how an ontology actually gets built, beyond
      the guide that exists — which only covers collecting examples, not building
      the model. Before it gets written it needs an audience, because the same
      material for you, for the trade marks experts, and for a steering group are
      three different documents.
    why_you: >
      You asked for it, so you are the one who knows what is currently unclear.
    if_unanswered: >
      Nothing is blocked. The guide does not get written, or gets written for the
      wrong reader.
    answer:
      kind: choice
      prompt: Who is it for?
      options:
        - value: for_me
          label: Me
        - value: for_experts
          label: The trade marks experts working from the existing guide
        - value: for_wider
          label: A wider audience — a steering group or an executive
        - value: not_now
          label: Not a priority — park it
    notes_prompt: >
      If there is a specific thing that has not clicked, name it. That is the most
      useful sentence you can write here.

  # ----------------------------------------------------------------- confirm

  - id: OQ-0012
    theme: confirm
    status: open
    needs: owner
    urgency: low
    raised: S005
    tracked_as: ['HANDOFF Q11', 'HANDOFF Q12']
    title: Seven small technical calls — tick any you want revisited
    plain: >
      Seven decisions were made so that work could continue rather than stop for an
      answer. None of them changes anything the system says about trade marks; they
      are about how files and tools behave. Leave a box unticked to confirm it.
      Tick one and it goes back on the list for a proper look.
    why_you: >
      They were recorded as provisional, and provisional means a person has not
      seen them. Confirming is what turns them into settled ground.
    if_unanswered: >
      Nothing is blocked. They stay marked provisional, and every future session
      has to keep flagging them.
    answer:
      kind: multi
      prompt: Tick anything you want revisited. Unticked means confirmed.
      options:
        - value: code_layout
          label: How the code is split into folders
          help: 'Two subpackages, one for the upstream reader and one for the evaluation set (ADR-0029).'
        - value: exit_codes
          label: Three severities, and a different exit code for each
          help: >
            A defect (something arrived wrong) fails a build; a gap (something is
            missing) reports and does not (ADR-0030).
        - value: one_file_per_type
          label: One file per kind of record, named — an unrecognised file is an error
          help: >
            A misspelt filename would otherwise silently exclude a set of expert
            judgements from every count (ADR-0032).
        - value: retired_ids
          label: Withdrawn identifiers are written down and never reused
          help: 'So a later allocator cannot walk into a gap left by a withdrawal (ADR-0033).'
        - value: optional_spreadsheet
          label: The spreadsheet library is an optional install
          help: 'The core tool stays at three dependencies; only the review path needs it (ADR-0035).'
        - value: workbook_cells
          label: How a record is laid out as spreadsheet columns
          help: 'Dotted column names, lists as newlines, sub-rows on child sheets (ADR-0036).'
        - value: transcription
          label: How an approved row gets written into the gold set
          help: >
            Every required field written, optional ones only when filled, and
            nothing at all without an explicit instruction to write (ADR-0037).
    notes_prompt: If you ticked one, say what bothers you about it.

  - id: OQ-0013
    theme: confirm
    status: open
    needs: owner
    urgency: low
    raised: S009
    tracked_as: ['HANDOFF Q15', 'Q18', 'Q20', 'Q21', 'Q22']
    title: Five rules that fence the review process — tick any you want revisited
    plain: >
      The review round — we draft examples, an expert corrects them, the
      corrections become approved knowledge — is fenced by five rules that decide
      what may cross from draft to approved. Each was an agent's judgement about
      what makes the process safe to audit, and they are what an audit would be
      judged against. Leave a box unticked to confirm it.
    why_you: >
      These decide when a machine may treat something as approved. That is exactly
      the boundary the whole project rests on.
    if_unanswered: >
      Nothing is blocked. The rules hold either way; they stay marked provisional
      and keep being flagged.
    answer:
      kind: multi
      prompt: Tick anything you want revisited. Unticked means confirmed.
      options:
        - value: seed_guards
          label: The six guards around machine-drafted examples
          help: >
            Drafts are quarantined, each carries a statement of what it is, the
            approval field starts empty and is checked, there is exactly one route
            out, and a draft is deleted once reviewed (ADR-0043).
        - value: transitive_hold
          label: A signed record that points at an unsigned one is held back too
          help: >
            Otherwise approved knowledge would rest on a record nobody checked
            (ADR-0048).
        - value: child_row_hold
          label: A signed record with one sub-row marked wrong is held whole
          help: >
            Writing it would certify a value the reviewer said was wrong
            (ADR-0048).
        - value: two_operations
          label: A decision that arrives as an email may do only two things
          help: >
            Sign a row already marked correct, or settle one named record.
            Anything wider — "they confirmed the corrections" — would be a blank
            cheque over hundreds of rows (ADR-0051).
        - value: critical_path
          label: What counts as being on the critical path
          help: >
            Which held records are counted as blocking, including a group of three
            that all wait on each other (ADR-0054).
        - value: scoped_round
          label: A partial review round must say on its face that it is partial
          help: >
            So a ten-record review is never filed as if it were the whole set
            (ADR-0055).
    notes_prompt: If you ticked one, say what bothers you about it.


  # ------------------------------------------------------- raised by S012

  - id: OQ-0019
    theme: unblocks
    status: open
    # Downgraded 2026-09-08 (ADR-0082). No longer blocking: RULE-0001's five
    # conclusions may now be served stamped `candidate`/`requiresHumanReview` like
    # any unreviewed content. Still worth your ruling — an agent may NOT fill a
    # rule's approved-by line, so only you can move it from unreviewed to approved.
    needs: owner
    urgency: low
    raised: S012
    tracked_as: ['RULE-0001', 'OQ-0003', 'Q-44', 'ADR-0069']
    title: 'The mixed-authority rule, again — and the number you were given was wrong'
    plain: >
      You asked to see the flagged passages before ruling on this rule. They are
      written out in full, with the wording that made each one fire, at the link
      below. Two things to say before you read them. First, the count in the
      earlier question was wrong: the rule flags five passages, not 71. Seventy-one
      was the number of rows of data it writes, and every flag carries about
      fourteen rows of record-keeping with it. Second, that correction changes what
      you are being asked. Five out of 216 passages is a rule being selective; 71
      out of 216 would have been a rule barely narrowing anything.
    why_you: >
      Nothing may be built on a rule nobody has approved, and you asked to see the
      evidence rather than take a summary. The evidence is now there, and the
      count it rests on has been fixed.
    if_unanswered: >
      The five flags stay quarantined. Any later feature that would warn "this
      passage mixes law and practice" cannot stand on a rule still marked pending.
    background:
      - label: The five passages, in full, with the wording that fired each one
        href: '#/reports?open=rule-0001-flags'
    answer:
      kind: choice
      prompt: Now that you have seen them, what is your call?
      options:
        - value: approve
          label: Approve it — its flags may be relied on
        - value: approve_pending_expert
          label: Approve it for now, with a trade marks expert to confirm later
        - value: reject
          label: Reject it — delete the rule
        - value: too_narrow
          label: Five is too few — it is missing passages it should catch
          help: >
            The rule fires only where an expert has already typed one phrase as
            legislation and another as practice, so it can only be as complete as
            that typing. Say which passage you expected to see.
    notes_prompt: If a passage on the list does not belong, name it.

  - id: OQ-0020
    theme: unblocks
    status: answered
    # Withdrawn 2026-09-08 (ADR-0079). No longer yours to do: an agent types the
    # 52 — and everything whole-Manual scope adds — into authored/concept-types.yaml,
    # stamped `unreviewed`. The workbook stays available if you or an expert would
    # rather correct in bulk. This is what the rule change was for.
    needs: owner
    urgency: high
    raised: S012
    tracked_as: ['OQ-0001', 'ADR-0071']
    answered:
      date: '2026-09-08'
      how: >-
        Withdrawn rather than answered. You changed the rule that made this yours:
        an agent now types the 52 itself, stamped as never validated by an expert,
        and you correct what is wrong instead of sorting 52 rows by hand.
      record: docs/DECISIONS.md
      applied: true
    title: The 52 concepts are ready for you to sort — here they are
    plain: >
      You confirmed the four groups and asked for the list. It is a spreadsheet
      with one row per concept and a dropdown in the type column. Each row says
      what the concept is called, what else the Manual calls it, and the terms it
      is explicitly *not* the same as; a companion document adds the passages each
      one was drawn from, for the rows where the names are not enough. Fill
      the dropdown, put your name and the date on each row you are sure about, and
      hand the file back. There is a fifth option beside the four groups — "none of
      these" — and it is a real answer rather than a way of skipping: it says the
      four groups do not fit that concept, which is evidence about the groups.
    why_you: >
      Sorting them is the legal judgement you said you were willing to make, and
      no amount of agent time substitutes for it. Leaving a row blank is fine and
      is different from "none of these" — a blank comes back on the next pass.
    if_unanswered: >
      The four groups stay empty, the vocabulary stays a flat list of 52, and
      search and retrieval later have nothing to generalise over. This is still
      the single largest gap in the draft.
    background:
      - label: The evidence to sort by — every concept, with its passages
        href: '#/reports?open=concept-typing'
    answer:
      kind: choice
      prompt: Where do you want to do this?
      options:
        - value: spreadsheet_ready
          label: I will fill in the spreadsheet — tell me where it is
          help: >
            `data/derived/concept-typing.xlsx` in the repository. Hand it back and
            a session reads it in.
        - value: on_the_dashboard
          label: I would rather do it here, on this page, a few at a time
          help: >
            A session builds the control. Fifty-two dropdowns do not fit in one
            submission, so it would come back to you in batches.
        - value: worked_examples_first
          label: Do five for me first so I can see the reasoning, then I will do the rest
          help: >
            A session proposes five with the passage it read for each, clearly
            marked unapproved, and you correct them.
        - value: someone_else
          label: This should go to a trade marks expert, not me
    notes_prompt: >
      If a group is missing or misnamed, say so here — that is more useful than
      forcing 52 concepts into four boxes that do not fit.

  - id: OQ-0018
    theme: scope
    status: open
    needs: owner
    urgency: medium
    raised: S012
    tracked_as: ['OQ-0009', 'ADR-0074', 'Q-11']
    title: The court decisions — what that other repository actually holds
    plain: >
      You said the decisions are in scope and pointed at your IP-Decision-Data
      repository. It was checked. It holds an index of 8,900 Australian
      intellectual property documents, 7,282 of them court decisions, and the index
      is the citation and a web address — **not a word of what any court said**.
      The full text is produced by the same pipeline but is deliberately not stored
      in the repository; it exists only as a build attachment, which expires. Of the
      58 decisions the section 43 material cites, **15 are in that index and 43 are
      not** — the missing ones are mostly Trade Marks Office delegate decisions and
      pre-1990 reported cases, which the source corpus does not carry.
    why_you: >
      Three things follow and none is an agent's call: whether 15 of 58 is worth
      building on, where the actual text is to come from and where it may be
      stored, and whether the missing 43 — the delegate decisions especially —
      matter enough to go looking for separately. There is also a licensing
      question about holding decision text at all.
    if_unanswered: >
      Nothing is blocked. "Which cases interpret this test" stays answerable and
      "what did the court hold" stays unanswerable, which is recorded and which a
      prohibition already stops the system pretending otherwise about.
    answer:
      kind: choice
      prompt: How should this go?
      options:
        - value: fifteen_is_enough
          label: Start with the 15 — get their text and store it, and tell me what it costs
        - value: find_the_rest
          label: Not worth it until the delegate decisions are there too — go and find them
        - value: index_only
          label: Store the citations and the links, no text
          help: >
            Cheap, and it makes "here is where to read it" possible without
            claiming to know what it says.
        - value: park_it
          label: Park it — the limitation is recorded and that is enough for now
    notes_prompt: >
      If there is another source for Trade Marks Office delegate decisions, naming
      it here is the most useful thing you could write.

  - id: OQ-0021
    theme: scope
    status: answered
    # Withdrawn 2026-09-08 (ADR-0081). The question asked you to adjudicate how
    # loosely the Manual cites provisions, for a boundary rule that no longer runs.
    # You removed the s 43 barrier; there is no boundary, so nothing to adjudicate.
    needs: owner
    urgency: medium
    raised: S012
    tracked_as: ['OQ-0014', 'ADR-0072']
    answered:
      date: '2026-09-08'
      how: >-
        Withdrawn rather than answered. It asked you to adjudicate how loosely the
        Manual cites provisions, for a boundary rule that no longer runs — you
        removed the section 43 barrier, so there is no boundary to draw.
      record: docs/DECISIONS.md
      applied: true
    title: Your one-hop boundary rule, and where the Manual does not cooperate
    plain: >
      Your rule — one hop, and the hop lands on the specific chunk rather than its
      parent section — is implemented and reported. It works: twelve parent
      provisions stay out of scope purely because of your second sentence. But it
      does not do what you expected for section 41. You wrote that section 43 would
      refer to a number of specific chunks within section 41; in fact the Manual
      writes "section 41" bare in 32 of the section 43 passages, as well as citing
      41(3) and 41(4). A bare citation names the whole section, so the whole of
      section 41 comes into scope and your second sentence never engages. Twenty-two
      provisions behave this way, including sections 42 and 44.
    why_you: >
      The rule met a corpus that cites more loosely than the rule assumes. Which
      way to resolve that is a scope judgement about how much neighbouring law the
      pilot carries, and it changes how much material everything downstream has to
      account for.
    if_unanswered: >
      The boundary stays as computed — wider than you probably intended, with the
      whole of sections 41, 42 and 44 inside it. Nothing breaks; the pilot is
      simply larger than the rule reads as describing.
    background:
      - label: The boundary, computed, with every provision it keeps out and lets in
        href: '#/reports?open=boundary'
    answer:
      kind: choice
      prompt: How should a bare citation be treated?
      options:
        - value: accept_bare
          label: A bare citation names the whole provision — accept it, as it works today
        - value: units_only
          label: Reach only the units actually discussed
          help: >
            Needs somebody to say which those are for each provision, so it is
            work rather than a setting.
        - value: special_case_41
          label: Leave the general rule alone and make section 41 a named special case
        - value: show_me_the_cost
          label: Show me what each option includes and excludes, then ask me again
    notes_prompt: Anything about how far the pilot should reach into neighbouring sections.

  - id: OQ-0022
    theme: expert
    status: answered
    # Withdrawn 2026-09-08 (ADR-0079). An agent now authors the examiner-conduct
    # rule as a relationship record, stamped `unreviewed`, citing the expert's own
    # note (review/returned/260826-expert-feedback.md) and Blount v Registrar as its
    # evidence. An expert corrects it rather than composing it.
    needs: expert
    urgency: medium
    raised: S012
    tracked_as: ['OQ-0015', 'ADR-0073']
    answered:
      date: '2026-09-08'
      how: >-
        Withdrawn rather than answered. Under the amended rule an agent writes the
        examiner-conduct rule itself, citing the expert's own note as its evidence,
        and an expert corrects it rather than composing it from nothing.
      record: docs/DECISIONS.md
      applied: true
    title: Should a rule about what an examiner must do be recorded like any other relationship?
    plain: >
      You asked whether a glossary captures the relationship between an examiner
      and a registrar, and said to adopt a Must/May predicate if it does not. It
      does not — a glossary holds one entry per term, and "an examiner must consult
      a team leader before accepting on doubt" is a relationship between two roles
      with a force attached, which no arrangement of definitions holds. So the
      predicate is adopted, and it turned out to exist already: every approved
      relationship can carry must, may or should. What was missing was the ability
      to make a relationship be *about* a role at all, and that is now possible.
      Nothing has been written into it.
    why_you: >
      Whether examiner conduct genuinely belongs in the same structure as
      "connotation must arise from the mark itself" is a judgement about the
      domain, not about the software. Recording a duty as a relationship makes it
      answerable by the same machinery as everything else, which is the argument
      for; it also flattens a rule about people into a shape built for rules about
      legal ideas, which is the argument against.
    if_unanswered: >
      The shape exists and stays empty, which is the honest state. The expert's
      note about the Registrar's actual bar for the presumption of registrability
      stays where it is, in the file it arrived in, and is not in the knowledge
      base.

