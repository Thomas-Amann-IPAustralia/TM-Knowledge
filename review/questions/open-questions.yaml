  - id: OQ-0017
    theme: expert
    status: parked
    # Still parked, and ADR-0079 did NOT settle it — flagged because it looks as
    # though it should have. An agent may now author a legal judgement, but reading
    # through an ambiguity upstream deliberately refused to resolve is rule 3, not
    # rule 1 (CLAUDE.md rule 6, second half). The distinction is narrow and a future
    # session may well get it wrong, so it stays on the queue rather than lapsing.
    needs: expert
    urgency: low
    raised: S008
    tracked_as: ['HANDOFF Q19', 'Q-07']
    title: May a bare "section 15(1)" be read as the Trade Marks Act?
    plain: >
      The expert rejected two draft prohibitions on a principle worth recording:
      that inferring a bare "section 15(1)" means the Trade Marks Act is acceptable
      given what this tool is for, and that the tool should be able to say when a
      passage is quoting legislation. That sits against the upstream position,
      which refuses to resolve an ambiguous reference at all. The two are not quite
      the same claim — upstream's ambiguity is about which of several instruments
      is meant — but a session must not quietly assume either reading.
    why_you: >
      Where the line sits between a safe inference and an invented one is a
      judgement about the corpus, not about code.
    if_unanswered: >
      Citation resolution in a later stage has no agreed rule, and one kind of
      prohibited use rests on a single record.
