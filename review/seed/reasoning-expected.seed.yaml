# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — expected reasoning results.  NOT PROJECT CONTENT. NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Guide: eval/STAGE-0-INPUT-GUIDE.md §5.7.
#
# ── THE LINE THIS RECORD TYPE EXISTS TO DRAW ──────────────────────────────
# An expected inference is something that follows from what the corpus *says*.
# Anything that requires weighing evidence or exercising discretion is not an
# inference — it is a prohibited use. Drawing that line is the most valuable
# judgement in this record type and every one of the fifteen below is a guess
# at where it falls.
#
# If a record here should really be a prohibited use, moving it is the single
# most useful correction you can make. The inverse matters too: a conclusion we
# have refused to draw that in fact follows plainly from the text is a
# capability given away for nothing.
#
# `given` is a starting position drawn from the corpus, not a hypothetical
# application. The system reasons over the corpus; it does not decide cases.
# ═══════════════════════════════════════════════════════════════════════════

