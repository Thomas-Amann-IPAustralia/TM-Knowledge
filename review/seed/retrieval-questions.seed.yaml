# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — AI retrieval questions.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Guide: eval/STAGE-0-INPUT-GUIDE.md §5.6.
#
# These specify what a correct answer's evidence package must contain. They do
# not contain answers, and they must not: writing the answer is the thing an
# agent may never do, and the whole design of this record type is built around
# not needing one.
#
# `qualifications_expected` is the field to spend your time on. It catches the
# characteristic AI failure — a fluent, correct-sounding, unqualified statement
# of a general rule. Write it as the things whose *absence* makes the answer
# wrong. Every one below is a guess about which qualifications matter, and a
# qualification we have missed is a hole in the test rather than a small error.
#
# `required_cases` holds citations only. No decision text exists anywhere in
# the programme (Q-11), so a question of the form "what did the court hold" is
# not answerable and must not be asked of the system.
# ═══════════════════════════════════════════════════════════════════════════

