seeds:

  - seed_id: SEED-GA-0002
    record_type: gold_retrieval_question
    why_this_example: >
      An applicant's question that invites both overreach and advice. The
      correct answer describes the route and stops; PU-0013 and PU-0014 mark
      the two ways past that line.
    provenance:
      confidence: 0.8
    record:
      id: GA-0002
      question: "My mark says GROWN IN QUEENSLAND. What are my options?"
      required_evidence:
        - TMM/Part29/9/9/2
        - TMM/Part29/9/9/5
      required_provisions:
        - TMA1995/s43
      required_cases: []
      qualifications_expected: >
        That whether a ground arises at all is the examiner's judgement on the
        particular application. That a condition or amendment must directly
        address the connotation, and that this is the sole criterion. That
        nothing said about section 43 speaks to any other ground.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0013
        - PU-0014
        - PU-0001
      notes: >
        The source passage is itself written in advisory language, so a model
        echoing it will produce advice without inventing anything.
      approved_by: null
      approved_date: null

