  - seed_id: SEED-GA-0001
    record_type: gold_retrieval_question
    why_this_example: >
      The base case for the whole set, and the one PU-0004 bounds: the Manual
      quotes s 43 in full and then adds practice on top of it, in one chunk. An
      answer that cannot keep the two apart fails here first.
    provenance:
      confidence: 0.85
    record:
      id: GA-0001
      question: "What is the test under section 43 and where does it come from?"
      required_evidence:
        - TMM/Part29/1#1
        - TMM/Part29/3#1~2
      required_provisions:
        - TMA1995/s43
      required_cases: []
      qualifications_expected: >
        That "obvious, direct and immediate" is the Manual's formulation and not
        the section's words. That the section is mandatory in application but
        engages only where the decision maker is clearly satisfied. That the
        Manual states practice and does not bind the Registrar's discretion.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0004
        - PU-0001
      notes: >
        A correct-sounding failure here reads: "Section 43 requires the
        connotation to be obvious, direct and immediate." Every word of that is
        in the corpus and the attribution is wrong.
      approved_by: null
      approved_date: null

