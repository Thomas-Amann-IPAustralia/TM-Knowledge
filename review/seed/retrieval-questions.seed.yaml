        the numerals rather than the letters.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0014
      notes: ~
      approved_by: null
      approved_date: null

  - seed_id: SEED-GA-0015
    record_type: gold_retrieval_question
    why_this_example: >
      A currency question the corpus can partly answer, where the honest half
      of the answer is about the marketplace and not about the document.
    provenance:
      confidence: 0.8
    record:
      id: GA-0015
      question: "The term meant nothing when the mark was filed but means something now. Does that matter?"
      required_evidence:
        - TMM/Part29/3/3/2
        - TMM/Part29/3/3/4
      required_provisions:
        - TMA1995/s43
      required_cases: []
      qualifications_expected: >
        That the current marketplace is what is considered, not the past or the
        future. That a connotation can develop over time and may emerge at
        opposition. That the Manual also asks, in the person material, how well
        known someone was as at the priority date — and that the two temporal
        rules are stated in different places.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0011
      notes: >
        Whether the two temporal rules conflict is a legal reading, not a
        drafting inconsistency. An answer that harmonises them without saying so
        has made a judgement.
      approved_by: null
      approved_date: null

  - seed_id: SEED-GA-0016
    record_type: gold_retrieval_question
    why_this_example: >
      A provenance question about the quality of a citation. It tests whether
      upstream's trust metadata survives all the way into an answer — the point
      of CLAUDE.md rule 3.
    provenance:
      confidence: 0.8
    record:
      id: GA-0016
      question: "Which section does this passage cite, and how confident are we that it is that one?"
      required_evidence:
        - TMM/Part29/10#1
        - TMM/Part29/1#1
      required_provisions:
        - TMA1995/s43
      required_cases: []
      qualifications_expected: >
        That one of the two passages carries a citation the Manual's authors
        linked themselves and the other carries a bare "s43" resolved to the Act
        by convention. That a resolution by convention is an inference, not a
        statement by IP Australia. That an ambiguous citation is never resolved
        silently.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0016
        - PU-0017
      notes: >
        PU-0017 flags this as arguably too strict — a qualification on every
        `default` resolution would drown the reader. That tension is live and
        this question is where it will be settled.
      approved_by: null
      approved_date: null

  - seed_id: SEED-GA-0017
    record_type: gold_retrieval_question
    why_this_example: >
      A question resting on a passage that cites an Act the programme does not
      hold. The answer must name the limit rather than route around it.
    provenance:
      confidence: 0.85
    record:
      id: GA-0017
      question: "What is the test for reasonable doubt in this context?"
      required_evidence:
        - TMM/Part29/3/3/1~1
        - TMM/Part29/3/3/1~2
      required_provisions: []
      required_cases:
        - CASE/1954/HCA/82
        - CASE/1999/FCA/1020
      qualifications_expected: >
        That the principles were set out in the context of a comparison between
        marks and under earlier legislation. That the Manual states how far they
        carry across. That the earlier Act is not held anywhere in the
        programme, so the provision behind them cannot be displayed.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0010
        - PU-0005
      notes: >
        `required_provisions` is empty on purpose: the provision the passage
        turns on is section 114 of the Trade Marks Act 1905, which resolves to
