  - seed_id: SEED-GA-0008
    record_type: gold_retrieval_question
    why_this_example: >
      A default-plus-exception question. Getting the default right and dropping
      the exception is the most likely failure, and it is invisible unless the
      test asks for both.
    provenance:
      confidence: 0.85
    record:
      id: GA-0008
      question: "Can a long-dead person's name be registered as a trade mark?"
      required_evidence:
        - TMM/Part29/6/6/2~1
        - TMM/Part29/6/6/2~2
      required_provisions:
        - TMA1995/s43
      required_cases:
        - CASE/2004/FCA/1247
        - CASE/2019/ATMO/41
      qualifications_expected: >
        That the general position is qualified by "generally". That the
        exception turns on continued control by the estate or an authorised
        entity, on consumer awareness of that control, and on a connection with
        the specified goods or services. That all three conditions are stated
        together.
      authority_distinction_required: true
      prohibited_conclusions:
        - PU-0001
        - PU-0007
      notes: ~
      approved_by: null
      approved_date: null

  - seed_id: SEED-GA-0014
    record_type: gold_retrieval_question
