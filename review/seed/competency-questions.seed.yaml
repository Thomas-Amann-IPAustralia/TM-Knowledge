# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — competency questions.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Every question below is a guess at what an examiner actually asks;
# some of them are the wrong question, and finding those is the point. Nothing
# here may be cited, promoted or counted until it comes back through
# `tmk-transcribe` with a name in `approved_by` (CLAUDE.md rule 4, ADR-0043).
#
# Guide: eval/STAGE-0-INPUT-GUIDE.md §5.1.  Read that first if a field is
# unclear — this file is the same shape, filled in.
# ═══════════════════════════════════════════════════════════════════════════

defaults:
  provenance:
    extraction_method: llm
    # The specific model is not recorded here: HANDOFF Q3 — which LLM is
    # agency-approved, and under what data-handling conditions — is still open,
    # and stamping an unapproved model's name into the repo would pre-empt it.
    # The generator and date below are what identify the run.
    model: null
    generator: tm-knowledge-agent-session-S007
    generated_on: "2026-08-21"
    confidence: null
    review_status: candidate
  review:
    status: unreviewed
    expert: null
    reviewed_on: null
    correction: null

seeds:

  # ── retrieval ────────────────────────────────────────────────────────────
  - seed_id: SEED-CQ-0002
    record_type: competency_question
    why_this_example: >
      A retrieval question whose answer is spread across five separate chunks
      that never name each other. It tests whether the system assembles a
      practice area or just returns the best-matching passage. If you think the
      list below is incomplete, adding to it is the most useful correction you
      can make to this record.
    provenance:
      confidence: 0.65
    record:
      id: CQ-0002
      question: >
        In what situations does the Manual say a section 43 ground arises
        because the applicant is not the owner or authorised user of something
        referred to in the trade mark?
      asked_by: examiner
      category: retrieval
      pilot_in_scope: true
      expected_sources:
        required:
          - TMM/Part29/7#1
          - TMM/Part29/8#1
          - TMM/Part29/8/8/3
        supporting:
          - TMM/Part29/8/8/1
          - TMM/Part29/8/8/2
          - TMM/Part29/6#1~2
      expected_concepts:
        - phoneword
        - internet domain name
        - radio call sign
        - authorised user
      must_not_include: []
      answer_shape: >
        Must list the situations separately rather than generalising them into a
        single rule, and must carry the qualification that each is reconsidered
        if the applicant establishes ownership or authorisation.
      caveats: >
        These passages share a structure and almost no vocabulary. A retrieval
        system matching on words will find one of them and stop.
      measured_by:
        - expected_source_coverage
        - recall_at_10
      approved_by: null
      approved_date: null

  - seed_id: SEED-CQ-0004
    record_type: competency_question
    why_this_example: >
      A question about the interaction between s 43 and a neighbouring ground.
      Whether this is in the pilot at all is a scope decision — `pilot_in_scope`
      is set true here as a proposal, and setting it false is a legitimate
      correction that parks the record rather than deleting it.
    provenance:
      confidence: 0.5
    record:
      id: CQ-0004
      question: >
        Where a trade mark contains an INN stem, what does the Manual say about
        raising section 43 alongside a ground under section 41 or section 44?
      asked_by: examiner
      category: retrieval
      pilot_in_scope: true
      expected_sources:
        required:
          - TMM/Part29/5/5/4
        supporting:
          - TMM/Part29/5/5/5
          - TMM/Part29/5/5/6~1
          - TMA1995/s41
          - TMA1995/s44
      expected_concepts:
        - International Non-Proprietary Name
        - INN stem
        - condition of registration
      must_not_include: []
      answer_shape: >
        Must state that the endorsement limiting use to goods containing the
        designated substance addresses the section 43 ground only, and must not
        imply that it disposes of a section 41 or section 44 ground.
      caveats: >
        The Manual states this negatively — "unlikely to assist in overcoming
        grounds… raised for other reasons". A summariser will drop the negation.
      measured_by:
        - expected_source_coverage
        - grounding
        - authority_weighting
      approved_by: null
      approved_date: null

  # ── search ───────────────────────────────────────────────────────────────
  - seed_id: SEED-CQ-0013
    record_type: competency_question
    why_this_example: >
      The currency category exists because a retrieval-only system fails it
      silently. This one is grounded in a real trap inside the pilot:
      TMM/Part29/3/3/1~2 cites section 114 of the *Trade Marks Act 1905*, and
      that instrument is not held anywhere in the programme (Q-24), so the
      citation resolves to nothing at all.
    provenance:
      confidence: 0.8
    record:
      id: CQ-0013
      question: >
        Which of the tests quoted in the section 43 material were decided under
        earlier legislation, and does that limit how they are used now?
      asked_by: examiner
      category: currency
      pilot_in_scope: true
      expected_sources:
        required:
          - TMM/Part29/3/3/1~2
        supporting:
          - TMM/Part29/3/3/1~1
      expected_concepts:
        - reasonable doubt
        - superseded legislation
      must_not_include: []
      answer_shape: >
        Must name the earlier instrument explicitly, must not present the quoted
        passage as authority on the current section without that qualification,
        and must reproduce the Manual's own statement of how far the principles
        carry across.
      caveats: >
        The 1905 Act is not in the corpus, so the system can name the citation
        and can never verify or display it.
      measured_by:
        - currency
        - citation_correctness
        - authority_weighting
      approved_by: null
      approved_date: null

  - seed_id: SEED-CQ-0014
    record_type: competency_question
    why_this_example: >
      A currency question the corpus cannot answer as posed. Guide §8 is blunt
      about this: a snapshot holds current text and the amendment log is the
      upstream repository's git history. Whether the pilot promises this at all
      belongs in `pilot-scope.md`, and this record is here to force that call.
    provenance:
      confidence: 0.85
    record:
      id: CQ-0014
      question: >
        What did the Manual say about geographical references at the priority
        date of an application filed two years ago?
      asked_by: examiner
      category: currency
      pilot_in_scope: false
      expected_sources:
        required: []
        supporting:
          - TMM/Part29/9#1
      expected_concepts:
        - priority date
      must_not_include: []
      answer_shape: >
        Must state that the held snapshot carries current text only, must not
        present today's text as the text that was current then, and must say
        what would be needed to answer properly.
      caveats: >
        Marked out of pilot scope as a proposal, not a decision (Q-05). If the
        pilot does promise point-in-time answers, this becomes in scope and the
        snapshot strategy has to change to support it.
      measured_by:
        - currency
        - prohibited_inferences
      approved_by: null
      approved_date: null

  - seed_id: SEED-CQ-0016
    record_type: competency_question
    why_this_example: >
      A currency question with a future-dated condition in the text itself.
      TMM/Part29/11#1 describes protection that applies "when the Australia
      European Union Free Trade Agreement enters into force" — a statement whose
      truth changes without the passage changing.
    provenance:
      confidence: 0.65
    record:
      id: CQ-0016
      question: >
        Are the listed European Union geographical indications protected in
        Australia now?
      asked_by: examiner
      category: currency
      pilot_in_scope: true
      expected_sources:
        required:
          - TMM/Part29/11#1
        supporting: []
      expected_concepts:
        - geographical indication
        - entry into force
      must_not_include: []
      answer_shape: >
        Must reproduce the conditional as a conditional, and must not resolve it
        into a present-tense statement in either direction. Must give the date
        the passage was last amended if it gives any temporal assurance at all.
      caveats: >
        A passage whose truth value depends on an external event is not stale in
        the content-hash sense, so no mechanical check in this repo will catch
        it going wrong.
      measured_by:
        - currency
        - grounding
      approved_by: null
      approved_date: null

  # ── impact ───────────────────────────────────────────────────────────────
