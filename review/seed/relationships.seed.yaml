# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — gold relationships.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Guide: eval/STAGE-0-INPUT-GUIDE.md §5.4.
#
# ── READ THIS BEFORE CORRECTING ANY RECORD ────────────────────────────────
# The guide says, in terms: *"Do not let an agent invent predicates and then
# have you fit relationships to them."* This file does exactly that, because
# the repo owner asked for a draft to correct rather than a blank form
# (ADR-0043). The inversion is deliberate and it carries the exact risk the
# guide names — so the predicate list below is the first thing to correct, and
# correcting it is worth more than correcting any individual record.
#
# CANDIDATE PREDICATE LIST — none of these is approved:
#
#   requiresElement       X cannot be established without Y
#   excludesBasis         X may not be established on the basis of Y
#   mayGiveRiseTo         Y is a possible consequence of X, not a certain one
#   doesNotGiveRiseTo     the Manual states expressly that X does not produce Y
#   isOvercomeBy          Y removes or answers X
#   appliesTo             X governs Y
#   qualifies             X limits or conditions Y without displacing it
#   interprets            X (a decision) construes Y (a provision or a term)
#   citesAuthorityFor     X cites Y in support of a proposition
#   allocatesTo           X says the subject matter belongs under Y instead
#   statesThresholdFor    X states how much of Y is enough
#   constrainsExaminerTo  X tells the examiner what they must or must not do
#   extendsTo             the treatment of X also covers Y
#   dependsOnExternalSource  X turns on material the programme does not hold
#
# If a predicate is wrong, missing, or two predicates are really one, say so
# on any record that uses it. The list will be rebuilt from your words rather
# than patched.
#
# ── MODALITY IS A LEGAL READING, NOT A PARSE ──────────────────────────────
# Every `modality` below is a guess. Whether a "may" is possibility or
# permission, and whether a "should" creates an obligation in practice, is the
# judgement guide §5.4 calls the highest-value one in the whole gold set.
# Records where the grammar and the reading come apart are marked in `notes`.
#
# ── WHAT YOU NEVER HAVE TO TYPE ───────────────────────────────────────────
# `span` and `source_content_hash` are null. `tmk-seed` locates the verbatim
# `supporting_text` in the chunk and fills both from the pinned snapshot.
# ═══════════════════════════════════════════════════════════════════════════

