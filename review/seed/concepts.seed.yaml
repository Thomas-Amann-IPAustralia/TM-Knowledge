# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — gold concepts.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Every `pref_label`, every `alt_labels` entry and — above all — every
# `not_labels` entry is a synonymy judgement that an agent is not competent to
# make (CLAUDE.md rule 1). They are here so that you can disagree with them,
# which is faster than starting from an empty list (ADR-0043).
#
# Guide: eval/STAGE-0-INPUT-GUIDE.md §5.3.
#
# The field to spend your time on is `not_labels`: the near-miss that shares
# most of its words and means something materially different. Everything
# clusters the obvious synonyms correctly; systems fail on those. If a
# not_label below is wrong, or if a concept is missing the one that matters,
# that single correction is worth more than the rest of the record.
# ═══════════════════════════════════════════════════════════════════════════

