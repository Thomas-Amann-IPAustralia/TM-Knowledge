# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — gold search questions.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Guide: eval/STAGE-0-INPUT-GUIDE.md §5.5.
#
# Two fields carry almost all the value, and both are guesses here:
#
#   `relevant[].grade` — 3 highly relevant · 2 relevant · 1 marginal. Every
#   grade below is a machine's opinion about what an examiner would want first.
#   Regrading is the fastest correction in this whole seed set and the one that
#   most directly moves the metrics (Recall@10, P@10, MRR, nDCG).
#
#   `irrelevant_but_tempting` — the passage that shares the query's words and
#   is the wrong answer. It is the search set's equivalent of `not_labels`, and
#   every one you add is a precision test that will actually fire.
#
# `uses_manual_terminology: false` on most of these on purpose. A query in the
# Manual's own words tests string matching, which already works. If a query
# below is not how anyone would really phrase it, rewriting it in the words
# people do use is the most useful thing you can do to this file.
# ═══════════════════════════════════════════════════════════════════════════

