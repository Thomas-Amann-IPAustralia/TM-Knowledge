# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — gold entities.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Guide: eval/STAGE-0-INPUT-GUIDE.md §5.2.
#
# ── THE BOUNDED CHUNK SET ─────────────────────────────────────────────────
# Recall is unmeasurable unless a bounded set of chunks is annotated
# *exhaustively* rather than cherry-picked (guide §4). Fourteen chunks were
# chosen, together about 9,600 characters:
#
#   TMM/Part29/1#1         TMM/Part29/1/1/2       TMM/Part29/2/2/2
#   TMM/Part29/2/2/3       TMM/Part29/2/2/4       TMM/Part29/3/3/2
#   TMM/Part29/3/3/3       TMM/Part29/3/3/4       TMM/Part29/5/5/5
#   TMM/Part29/6/6/2~3     TMM/Part29/7#1         TMM/Part29/9/9/2
#   TMM/Part29/9/9/5       TMM/Part29/10#1
#
# ── THE ANNOTATION RULE — CORRECT THIS BEFORE YOU CORRECT ANY RECORD ──────
# Within those chunks, a mention is annotated where it is:
#   · a legal concept carrying a test, a threshold or a defined meaning;
#   · a legislative provision, at any level, however written;
#   · a judicial or Registrar's decision;
#   · a category of evidence or of research material;
#   · an instruction to the examiner — the clause that tells them what to do;
#   · a role (examiner, decision maker, applicant, Registrar, consumer);
#   · a date or temporal expression that bears on examination;
#   · anything else a system must recognise, as `Other`.
#
# Deliberately NOT annotated: the bare term "trade mark" and the pronouns
# standing in for it. It appears up to eight times in a single chunk and
# discriminates nothing, so annotating it would triple the set and flatter
# every recall figure taken over it.
#
# **TMM/Part29/2/2/2 is annotated without that exclusion**, as a demonstration
# of what fully exhaustive looks like. Compare it against the others and tell
# us which rule you want. That single decision is worth more than any
# correction to an individual record below, because it decides what the
# hundreds of records after this seed set will look like.
#
# ── WHAT YOU NEVER HAVE TO TYPE ───────────────────────────────────────────
# `span` and `source_content_hash` are null here on purpose. `tmk-seed`
# locates the `surface` in the chunk and fills both from the pinned snapshot.
# Correct a surface and the offsets follow it. Where a surface appears more
# than once, `locate.occurrence` says which mention is meant — and where it is
# missing on an ambiguous surface, the tool reports it rather than guessing.
# ═══════════════════════════════════════════════════════════════════════════

