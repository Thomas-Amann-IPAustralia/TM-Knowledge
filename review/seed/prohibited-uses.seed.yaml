# ═══════════════════════════════════════════════════════════════════════════
# SEED EXAMPLES — prohibited uses.  NOT PROJECT CONTENT.  NOT APPROVED.
#
# Machine-written drafts over the s 43 pilot, for a Trade Mark expert to
# correct. Each `prohibited` field is a sentence the finished system might
# plausibly emit and must not; each becomes a test whose threshold is zero.
# Whether a given sentence really is impermissible is a legal judgement, and
# none of these has been made by anyone qualified to make it (ADR-0043).
#
# Guide: eval/STAGE-0-INPUT-GUIDE.md §5.8.  Three examples of each of the six
# `kind` values, because the definition of done asks for all six covered and a
# set that skips the awkward ones tests the easy half.
# ═══════════════════════════════════════════════════════════════════════════

