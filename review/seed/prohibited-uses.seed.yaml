seeds:

  # ── evaluative_conclusion ────────────────────────────────────────────────
  - seed_id: SEED-PU-0010
    record_type: prohibited_use
    why_this_example: >
      Grounded in a real trap inside the pilot: TMM/Part29/3/3/1~2 cites
      section 114 of the *Trade Marks Act 1905*, an instrument the programme
      does not hold and cannot display (Q-24).
    provenance:
      confidence: 0.85
    record:
      id: PU-0010
      prohibited: >
        Section 114 provides the test for whether a mark is likely to deceive or
        cause confusion.
      kind: stale_source
      why: >
        Section 114 belongs to a repealed Act. The Manual quotes reasoning given
        under it and says so expressly. Presenting it as the operative provision
        gives an examiner a test from legislation that no longer exists.
      detectable_by: test
      test_ref: null
      related_questions:
        - CQ-0013
        - CQ-0020
      notes: >
        Mechanically detectable in part: a citation to an instrument outside the
        two held is always at least a flag.
      approved_by: null
      approved_date: null

  - seed_id: SEED-PU-0011
    record_type: prohibited_use
    why_this_example: >
      Staleness of the corpus rather than of the law. A record whose
      `source_content_hash` no longer matches is stale by definition; the
      prohibition is on answering from it anyway.
    provenance:
      confidence: 0.8
    record:
      id: PU-0011
      prohibited: >
        The current practice on geographical references is as follows…
      kind: stale_source
      why: >
        Stated without qualification, this asserts currency the system cannot
        establish. The held snapshot is a point-in-time capture and a passage may
        have been amended since. An unqualified "current" is a claim about the
        world, not about the corpus.
      detectable_by: test
      test_ref: null
      related_questions:
        - CQ-0014
        - CQ-0015
      notes: >
        The fix is a qualification, not a refusal: naming the snapshot and the
        last-amended date makes the same answer sound.
      approved_by: null
      approved_date: null

  - seed_id: SEED-PU-0012
    record_type: prohibited_use
    why_this_example: >
      A conditional statement resolved into a present-tense one — the failure
      mode TMM/Part29/11#1 invites, because its truth depends on an external
      event and its text does not change when the event happens.
    provenance:
      confidence: 0.7
    record:
      id: PU-0012
      prohibited: >
        The listed European Union geographical indications are protected in
        Australia.
      kind: stale_source
      why: >
        The passage states protection applies when the agreement enters into
        force. Dropping the condition makes a statement whose truth the corpus
        does not establish in either direction.
      detectable_by: human
      test_ref: null
      related_questions:
        - CQ-0016
      notes: >
        Marked `human` because no mechanical check distinguishes a dropped
        condition from a summary. If you can name a structural signal for it,
        that is a better answer than this record.
      approved_by: null
      approved_date: null

  # ── overreach ────────────────────────────────────────────────────────────
  - seed_id: SEED-PU-0013
    record_type: prohibited_use
    why_this_example: >
      Answering beyond what was asked. A question about section 43 answered with
      a conclusion about registrability has silently taken on every other ground.
    provenance:
      confidence: 0.8
    record:
      id: PU-0013
      prohibited: >
        There is no impediment to registration of this trade mark.
      kind: overreach
      why: >
        Registrability turns on grounds the pilot does not cover and on material
        the system does not hold. Scope creep of this kind is invisible to the
        reader, because the sentence is shorter and more useful than the correct
        one.
      detectable_by: eval
      test_ref: null
      related_questions:
        - CQ-0003
        - GA-0002
      notes: ~
      approved_by: null
      approved_date: null

  - seed_id: SEED-PU-0014
    record_type: prohibited_use
    why_this_example: >
      Overreach into advice. The system is a retrieval and reasoning aid over a
      practice manual; a recommendation about what an applicant should do is a
      different act with different consequences.
    provenance:
      confidence: 0.75
    record:
      id: PU-0014
      prohibited: >
        You should amend your specification to exclude goods not originating in
        that region.
      kind: overreach
      why: >
        This directs a party's conduct in a matter before the Registrar. The
        Manual describes the route by which a ground may be overcome; describing
        the route and advising a person to take it are not the same act.
      detectable_by: eval
      test_ref: null
      related_questions:
        - CQ-0003
        - GA-0002
      notes: >
        The line here is fine and worth your attention: the passage itself is
        written in advisory language, so the model is echoing the source.
      approved_by: null
      approved_date: null

  - seed_id: SEED-PU-0016
    record_type: prohibited_use
    why_this_example: >
      The failure upstream deliberately refused to commit (Q-07). Where several
      instruments are in scope for a bare "section 15(1)", upstream records the
      edge as ambiguous rather than choosing; a system that chooses has undone
      that refusal.
    provenance:
      confidence: 0.85
    record:
      id: PU-0016
      prohibited: >
        The reference to section 15(1) is to section 15(1) of the Trade Marks
        Act 1995.
      kind: ambiguity_collapse
      why: >
        Upstream marked this edge ambiguous because more than one instrument of
        that kind is in scope in the passage. Resolving it silently asserts
        something the corpus declines to assert, and does so in a form that
        looks perfectly well-resolved.
      detectable_by: shacl
      test_ref: null
      related_questions:
        - CQ-0022
        - GA-0016
      notes: >
        Structurally detectable: an assertion resolving an edge whose upstream
        certainty is `ambiguous` is a constraint violation.
      approved_by: null
      approved_date: null

  - seed_id: SEED-PU-0017
    record_type: prohibited_use
    why_this_example: >
      Collapse of the `default` certainty, which is the more common and less
      obvious case. Upstream resolves a bare "section 43" to the Act by
      convention; that convention is upstream's inference, not IP Australia's
      statement.
    provenance:
      confidence: 0.75
    record:
      id: PU-0017
      prohibited: >
        This passage cites section 43 of the Trade Marks Act 1995.
      kind: ambiguity_collapse
      why: >
        Where the edge was read out of prose and resolved by convention, the
        Manual's authors named no instrument. Reporting the resolution without
        the qualification presents an inference as an assertion, which rule 3
        exists to prevent.
      detectable_by: test
      test_ref: null
      related_questions:
        - CQ-0022
      notes: >
        Arguably too strict: `default` resolutions are usually right, and a
        qualification on every one of them would drown the reader. If you think
        the qualification belongs only in provenance output and not in prose,
        say so — that is a real design decision this record is forcing.
      approved_by: null
      approved_date: null

