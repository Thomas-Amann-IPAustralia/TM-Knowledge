  question: How will the ontology be reviewed and signed from here?
  kind: instruction
  value: waterfall_group_review
  label: No expert signs anything until the ontology ships; then a group of trade mark examiners reviews
    it all at once — get it as close to production ready as possible first
  quote: no experts will be signing anything off until we ship the best version of the Ontology we can
    muster to share with them. This is full on waterfall delivery at this point. Co-design is out the
    window. To be clear, it WILL be reviewed by an expert but it will be a group of trade mark examiners,
    all at once, so we need to get this things as close to 'production ready' as we can before it goes
    to them for testing/review.
