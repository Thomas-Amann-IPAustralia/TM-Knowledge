  question: How should doubt, consultation and escalation be recorded?
  kind: instruction
  value: general_escalation_from_text
  label: 'Standard practice whenever a delegate is in doubt, not unique to s 43: consult a delegate who
    is an SME and/or escalate up the chain (Examiner -> Senior Examiner -> Examination Team Leader); do
    not cite the expert note; hang it on evidence in the text'
  quote: This essentially describes what is considered good/standard practice if doubt exists, It is fair
    to assert that when a delegate is unsure about the correct decision they consult with another delegate
    who is a subject matter expert on that particular matter and/or they escalate the matter to a delegate
    that is higher on the chain of command (Examiner -> Senior Examiner -> Examination Team Leader), This
    escalation pathway is not unique to s43, If doubt exists the delegate should escalate or consult,
    I would prefer to avoid citing the expert note in the manner suggested, Ideally this should be hung
    on evidence within the text.
