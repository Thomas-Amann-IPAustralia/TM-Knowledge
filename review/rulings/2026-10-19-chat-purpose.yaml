- id: CHAT-0085
  item: the review's intended uses (docs/ONTOLOGY-REVIEW-RESPONSE-2.md, first version, decision 1)
  question: What is the ontology for?
  kind: instruction
  value: foundation_examiners_customers
  label: A foundational layer for future ML, decision-making, customer service and policy aids;
    immediately, an examiner research and decision-support tool and a customer explanation aid
  quote: >-
    The ontology is being written to operate as a foundational layer for any future machine
    learning, machine decision making, customer service delivery or policy writing aid (simulating
    flow on affects of amendments). In the immediate, for examiners, it must operate as a research
    and decision-support tool, helping them quickly identify relevant sections of guidance,
    legislation and related material. The immediate use case for IP Australia's 'customers' is
    about improving understanding of trade mark requirements, the application process and
    objections raised during examination (likely an LLM driven chatbot with clear visuals for
    explainability).
  notes: >-
    The owner says this has always been the intention. It supersedes ADR-0109's first decision
    (the purpose is a pitch). It does not withdraw ADR-0109's second (a working system soon
    outranks completeness), ADR-0110's way of working, or any hard rule in CLAUDE.md §2, including
    that no system states an examination outcome.
  recorded_as:
