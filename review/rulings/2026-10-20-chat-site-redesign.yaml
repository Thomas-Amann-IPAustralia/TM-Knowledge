answers:
- id: CHAT-0097
  item: the front end's purpose and design
  question: What should the examiner site's front end be designed to do, and how?
  kind: instruction
  value: redesign_outcome_first
  label: Redesign it to show the ontology's value, outcome first, visual and uncluttered, how it works explained simply
  quote: >-
    The primary purpose of the front end is to communicate the value of the underlying ontology. It
    ought to communicate the outcome first, the ontology isn't the focus its a means to an end, and
    its the outcome we should focus on. That being said, we still should communicate how it works
    (and explain it in an easy to understand way).
  notes: >-
    Also in the owner's words: communicate visually wherever possible; interactivity where it helps
    (the knowledge graph above all); progressive disclosure; no clutter; the ChatGPT mock-up's vibe
    liked but not binding; any library; desktop and laptop only, no mobile interactivity; and the
    work must not change the shape of the ontology.
