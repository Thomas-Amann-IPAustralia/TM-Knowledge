- id: CHAT-0093
  item: the site's emphasis and order
  question: What should the examiner site lead with, and in what order should it disclose the rest?
  kind: instruction
  value: outcomes_first
  label: PoC outcomes, then future outcomes, then rules as code, then the ontology
  quote: >-
    I'd like to change the emphasis of the site, instead of putting the ontology as the front and
    center talking piece, instead, I'd like to focus more on what the ontology enables.
  recorded_as: [ADR-0145]
- id: CHAT-0094
  item: transparency about the current state and customer testing
  question: What should the site say about its state and about customers?
  kind: instruction
  value: transparent
  label: Say plainly what exists, and what may eventually be tested with customers
  quote: >-
    I'd like the site to be transparent about the current state including what we may eventually
    test with customers.
  notes: Describing possible customer testing on the examiner site is not testing with customers or
    publishing to them; those stay owner gates (CLAUDE.md §3a).
  recorded_as: [ADR-0145]
- id: CHAT-0095
  item: standards explained for every reader
