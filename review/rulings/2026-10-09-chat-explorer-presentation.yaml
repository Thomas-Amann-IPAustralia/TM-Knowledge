applied:
  session: S028
  date: '2026-10-09'
  branch: claude/happy-noether-i4uufc
  what_changed: >-
    The explorer (site/) only; no record changed. A reviewed record now carries a plain grey
    "Reviewed" in place of the green "Expert-signed" badge, and no name; every map draws
    every idea and connection alike (no filled-versus-dashed); the "Only what an expert
    signed" filter and the "signed by an expert" counts are gone; machine-written records
