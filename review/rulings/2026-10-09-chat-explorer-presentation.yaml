    (amber diamond) and the Regulations (plum hexagon) each have their own colour and mark,
    on the map's text level as three labelled boxes, in chips, quotes, the Ask diagram and
    citation counts. The circles moved to `#/circles` ("At a glance"); the home page no
    longer draws them (ADR-0130).
