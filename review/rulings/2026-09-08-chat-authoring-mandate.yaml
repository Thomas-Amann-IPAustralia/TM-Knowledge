schema: tmk-ruling/1-manual
received_utc: '2026-09-08T00:00:00Z'
questions_updated: '2026-09-08'
source:
  kind: chat
  artefact: review/returned/260908-owner-chat-scope-and-authoring.md
  author: Thomas-Amann-IPAustralia
  relayed_by: S015 agent
  title: Remove the s 43 boundary; permit authored legal content stamped unreviewed
applied:
  session: S015
  date: '2026-09-08'
  branch: claude/knowledge-graph-ontology-overview-udcwba
  what_changed: >-
    The operating model. CLAUDE.md rule 1 is rewritten from a prohibition on
    authoring legal content into a prohibition on laundering it: an agent now
    authors definitions, concept types, relationships, modality readings, rules
    and exceptions, each stamped unreviewed with its model, date, evidence and
    authoring basis (ADR-0079). Authored content lives in `authored/` and
    `eval/gold/` is frozen at the 190 signed records so it stays usable as an
    independent yardstick (ADR-0080). The section 43 boundary is withdrawn and
    the whole Manual is in scope; ADR-0022 and ADR-0072 are superseded and
    `tmk-boundary` is retired (ADR-0081). Tier 3 stops being a gate and becomes a
    label, with the honesty burden moved onto every surface that serves knowledge
    to a person (ADR-0082, supersedes ADR-0008). Stages 2-4 open across all 54
    Parts (ADR-0083, supersedes ADR-0010). The 178 held seed records are resolved
    by authoring rather than by waiting on an expert round (ADR-0084). A
    four-state review model keeps "nobody objected" distinguishable from "an
    expert signed it" (ADR-0085).
  corrections_owed: >-
    None. Two figures quoted to him earlier in the same session were checked
    before he decided: the 52 concepts draw 86 of their ~95 definition-source
    references from Part 29, and 4 of the 9 role terms his expert named are
    absent from the vocabulary entirely.
  also: >-
    One thing he did not ask to change was preserved and flagged to him in the
    same exchange: the product may still not state an examination outcome to an
    examiner. He removed the review gate on knowledge; that limit is a scope
    constraint from the roadmap and from his expert's signed prohibited-use
    records. He was told it could be lifted on his word and gave no such
    instruction, so it stands (ADR-0082 consequence 4).
answers:
- id: CHAT-0001
  question: Should the section 43 boundary be removed and the whole Manual brought into scope?
  kind: instruction
  value: remove_boundary
  label: Completely remove the s43 barrier
  quote: 'yes, I would like to completely remove the s43 barrier.'
  recorded_as: [ADR-0081]
- id: CHAT-0002
  question: May an agent make higher-risk legal calls if it records them as unreviewed?
  kind: instruction
  value: author_with_unreviewed_stamp
  label: Yes — author, provided it is recorded as not reviewed or approved by an expert
  quote: >-
    I would like you to update your rule so that you can make higher risk
    decisions AS LONG AS you record it has not been reviewed or approved by an
    expert yet.
  recorded_as: [ADR-0079, ADR-0085]
- id: CHAT-0003
  question: Where should authored legal content live, relative to the 190 signed records?
  kind: choice
  value: separate_graph_reads_both
  label: Kept separate, graph reads both
  notes: >-
    eval/gold/ frozen as the signed set so it remains an uncontaminated yardstick;
    authored/ holds machine-authored content; the graph reads both and stamps
    every node with its origin.
  recorded_as: [ADR-0080]
- id: CHAT-0004
  question: Does unreviewed content stay out of what the system tells an examiner, or is labelling enough?
  kind: choice
  value: labelling_is_enough
  label: Labelling is enough
  notes: >-
    Removes ADR-0008's Tier 3 gate. The weight moves onto the label being visible
    at the point of use, which Stages 7-8 inherit as a build requirement.
  recorded_as: [ADR-0082]
- id: CHAT-0005
  question: Does this open the extraction stages (2-4), or only hand-authoring?
  kind: choice
  value: open_stages_2_to_4
  label: Yes — open Stages 2-4
  notes: >-
    Supersedes ADR-0010. Makes HANDOFF Q3 — which LLM is agency-approved, under
    what data-handling conditions — a live blocker for model-backed extraction
    for the first time.
  recorded_as: [ADR-0083]
- id: CHAT-0006
  question: What happens to the 178 held seed records and the 10 decisions blocking 168 of them?
  kind: choice
  value: resolve_all_marked_unreviewed
  label: Resolve them all now, marked unreviewed
  notes: >-
    The eight records the expert rejected are not resurrected — a signed
    rejection is a human decision and ADR-0079 does not license reversing one.
  recorded_as: [ADR-0084]
