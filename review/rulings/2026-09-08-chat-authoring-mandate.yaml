# dashboard form. Hand-transcribed by the S015 agent in the session it was given,
# NOT generated by `tmk-ruling` — there is no issue behind it.
#
# The artefact is `review/returned/260908-owner-chat-scope-and-authoring.md`,
# which carries his words verbatim. This file is the machine-readable index of
# what he settled, in the same shape a form submission would produce, so that a
# session reading `review/rulings/` first (CLAUDE.md §1 step 2) does not miss the
# largest governance change the repo has had.
