    question: At what point in time is the marketplace assessed when deciding whether a sign is likely
      to deceive or cause confusion?
    asked_by: examiner
    category: currency
    pilot_in_scope: true
    expected_sources:
      required:
      - TMM/Part29/3/3/2
      supporting:
      - TMM/Part29/3/3/4
      - TMM/Part29/6#1~2
    expected_concepts:
