  record:
    id: CQ-0001
    question: What guidance does the Manual give on when a ground for rejection under section 43 should
      be raised?
    asked_by: examiner
    category: retrieval
    pilot_in_scope: true
    expected_sources:
      required:
      - TMM/Part29/1#1
      supporting:
      - TMA1995/s43
      - TMM/Part29/2/2/4
      - TMM/Part29/3#1~1
    expected_concepts:
    - connotation
    - likely to deceive or cause confusion
    - ground for rejection
    answer_shape: Must state the statutory test in the words of s 43 and separately state the Manual's
      practice guidance, marked as practice rather than as law. Must convey that the section is mandatory
      in application while the threshold question — whether the decision maker is clearly satisfied —
      is an evaluative one.
    caveats: The Manual's own text quotes s 43 in full inside TMM/Part29/1#1, so an answer can appear
      to cite the Act while only having read the Manual. That is a grounding failure that will not show
      up as a missing source.
    measured_by:
    - expected_source_coverage
    - citation_correctness
    - authority_weighting
    approved_by: TC
    approved_date: '2026-08-25'
