  record:
    id: PU-0004
    prohibited: Section 43 of the Act requires the connotation to be obvious, direct and immediate.
    kind: authority_conflation
    why: The section requires no such thing. That formulation is the Manual's statement of practice. Attributing
      it to the Act gives an examiner a statutory requirement that does not exist and takes away the Registrar's
      discretion in the same sentence.
    detectable_by: shacl
    related_questions:
    - CQ-0021
    - CQ-0024
    - GA-0001
    notes: 'Structurally detectable: the claim attaches a Manual-sourced proposition to a legislative
      ref. That is a constraint a shape can express.'
    approved_by: null
    approved_date: null
