  record:
    id: PU-0011
    prohibited: The current practice on geographical references is as follows…
    kind: stale_source
    why: Stated without qualification, this asserts currency the system cannot establish. The held snapshot
      is a point-in-time capture and a passage may have been amended since. An unqualified "current" is
      a claim about the world, not about the corpus.
    detectable_by: test
    related_questions:
    - CQ-0014
    - CQ-0015
    notes: 'The fix is a qualification, not a refusal: naming the snapshot and the last-amended date makes
      the same answer sound.'
    approved_by: null
    approved_date: null
