[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-knowledge"
version = "0.1.0"
description = "Ontology and knowledge graph over the Australian trade marks examination corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Adding a dependency here is a decision to raise, not to make. See CLAUDE.md.
dependencies = [
    "jsonschema>=4.21",
    "referencing>=0.35",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "openpyxl>=3.1", "rdflib>=7.0", "pyshacl>=0.26"]
# The intake path (P7, P8) writes and reads .xlsx. Optional on purpose: it is
# the only thing in the repo that needs a spreadsheet library, and the core
# install stays at three dependencies. ADR-0035 — raise it if that is wrong.
intake = ["openpyxl>=3.1"]
# The RDF layer (Stages 5, 6, 9). Optional for the same reason as `intake`:
# the core install stays at three dependencies and a session that only runs the
# Stage 0 harness does not need a triple store. Both libraries are the roadmap's
# own choices — ARCHITECTURE.md §5 names RDFLib and pySHACL — so this is the
# reference stack, not a substitution (ADR-0056).
rdf = ["rdflib>=7.0", "pyshacl>=0.26"]

[project.scripts]
tmk-fetch-upstream = "tm_knowledge.upstream.fetch:main"
tmk-recon = "tm_knowledge.stage0.cli:recon"
tmk-worksheet = "tm_knowledge.stage0.cli:worksheet"
tmk-harness = "tm_knowledge.stage0.cli:harness"
tmk-coverage = "tm_knowledge.stage0.cli:coverage"
tmk-blockers = "tm_knowledge.stage0.cli:blockers"
tmk-workbook = "tm_knowledge.stage0.cli:workbook"
tmk-transcribe = "tm_knowledge.stage0.cli:transcribe"
tmk-seed = "tm_knowledge.stage0.cli:seed"
tmk-reconcile = "tm_knowledge.stage0.cli:reconcile"
tmk-typing = "tm_knowledge.stage0.cli:typing"
tmk-concepts = "tm_knowledge.stage0.cli:concepts"
tmk-graph = "tm_knowledge.ontology.cli:graph"
tmk-shacl = "tm_knowledge.ontology.cli:shacl"
tmk-ask = "tm_knowledge.ontology.cli:ask"
tmk-ontology-relations = "tm_knowledge.ontology.cli:relations"
tmk-ontology-report = "tm_knowledge.ontology.cli:ontology_report"
tmk-flags = "tm_knowledge.ontology.cli:flags"
tmk-dashboard = "tm_knowledge.dashboard.cli:dashboard"
tmk-ruling = "tm_knowledge.dashboard.cli:ruling"

[project.urls]
Homepage = "https://github.com/Thomas-Amann-IPAustralia/TM-Knowledge"
Upstream = "https://github.com/Thomas-Amann-IPAustralia/manual-XtrACTor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixtures are data, not tests. Keep the collector out of them.
norecursedirs = ["tests/fixtures"]
markers = [
    "snapshot: needs the pinned upstream snapshot in data/upstream/ (see data/README.md)",
    "rdf: needs the optional [rdf] extra — rdflib and pySHACL",
]
filterwarnings = [
    # rdflib 7.6 deprecated Dataset.default_context in favour of default_graph
    # and then kept calling it itself, from Graph.__str__ and from query(). The
    # project's own uses are migrated; these are rdflib's, and 5,000 lines of
    # them hide real warnings.
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
    "ignore:Dataset.identifier is deprecated:DeprecationWarning",
]
