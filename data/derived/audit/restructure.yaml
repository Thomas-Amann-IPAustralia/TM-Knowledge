note: >-
  The S029 structure review, on the owner's instruction of 2026-10-09 (ADR-0131): every
  machine-written "is related to" edge re-read as the relationship its sentence states, or
  withdrawn; edges whose ends are not kinds their predicate joins re-read or withdrawn;
  concepts filed under none_of_these, or under a kind they are not, re-typed; isolated
  concepts connected from passages that state the connection; and four "is a kind of" links in
  signed records corrected outside the signature. Machine-written by an agent session,
  unreviewed: a judgement per line, each for an examiner to disagree with. Applied by
  `tmk-bulk restructure --write`.
