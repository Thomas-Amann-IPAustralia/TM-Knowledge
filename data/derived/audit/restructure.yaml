# --- new relationships, each from a passage that states it ----------------------
new_edges:
- subject: GC-0021
  predicate: qualifies
  object: GC-0017
  ref: TMM/Part29/9/9/3~1
  quote: A geographical reference used without any qualifying information may not result in consumers
    being deceived, but may be likely to cause confusion.
  why: Qualifying information ("made in", "product of") changes what a geographical reference claims,
    and so how it is assessed.
- subject: GC-0169
  predicate: isProtectedThrough
  object: GC-0170
  ref: TMM/Part32B/1/1/3
  quote: 'The Register of Protected Geographical Indications and Other Terms (the Wine Register) lists the
    four categories of terms that Australia and the European Union will protect. These are listed in the
    following 5 searches in the Wine Australia website: Australian Geographical Indications (‘Australian
    GIs’) European Geographical Indications (‘European GIs’)'
  why: Wine geographical indications are protected by entry on the Wine Register (ruling A4).
- subject: GC-0126
  predicate: isProtectedThrough
  object: GC-0170
  ref: TMM/Part32B/2/1/2/1/4
  quote: Pending applications for inclusion on the Wine Register have no level of protection under the
    Wine Australia Act until they are on the Wine Register as a protected term.
  why: A term is protected under the Wine Australia Act once it is on the Wine Register, and not before.
- subject: GC-0177
  predicate: performs
  object: GC-0092
  ref: TMM/Part60/4/1#1
  quote: Once the IRDA has successfully gone through IP Australia's examination and opposition processes,
    protection is extended in Australia and the IRDA is then known as a protected international trade
    mark.
  why: Examination is IP Australia's process, as the office in which the Registrar's functions are
    exercised.
- subject: GC-0058
  predicate: appliesTo
  object: GC-0152
  ref: TMA1995/s41
  quote: '(1) An application for the registration of a trade mark must be rejected if the trade mark is
    not capable of distinguishing the applicant’s goods or services in respect of which the trade mark
    is sought to be registered (the designated goods or services) from the goods or services of other
    persons. Note: For goods of a person and services of a person see section 6.'
  why: The test asks whether the mark distinguishes the applicant's services from the services of other
    persons, the term section 6 defines.
- subject: GC-0180
  predicate: appliesTo
  object: GC-0093
  ref: TMM/Part39/4/4/1
  quote: Accordingly it is office practice not to publish acceptance of an application until at least five
    months after the priority date.
  why: Office practice governs when acceptance is published.
- subject: GC-0046
  predicate: actsAs
  object: GC-0149
  ref: TMR1995/r17A.10(3)
  quote: (3) If a request is made through the Trade Marks Office, the Registrar must perform the
    functions, under the Protocol, of the Office of the Contracting Party of the holder in relation to the
    request.
  why: For a request made through the Trade Marks Office, the Registrar performs that Office's functions.
- subject: GC-0033
  predicate: isPartOf
  object: GC-0032
  ref: TMM/Part29/8/8/1
  quote: Top level domain (TLD) refers to the last segment of a domain name.
  why: A top level domain is the last segment of a domain name — a part of it, not a kind of it.
- subject: GC-0138
  predicate: keeps
  object: GC-0161
  ref: TMR1995/r17A.2
  quote: International Register means the register maintained by the International Bureau for the
    purposes of the Protocol.
  why: The International Bureau maintains the International Register.
- subject: GC-0046
  predicate: keeps
  object: GC-0165
  ref: TMR1995/r17A.66(1)
  quote: (1) The Registrar must maintain a Record of International Registrations for the purposes of this
    Part.
  why: The Registrar maintains the Record of International Registrations (reg 17A.66).
- subject: GC-0046
  predicate: keeps
  object: GC-0089
  ref: TMA1995/s207
  quote: '(1) A Register of Trade Marks is to be kept at the Trade Marks Office. (2) The Registrar must
    enter in the Register in accordance with this Act:'
  why: The Register is kept at the Trade Marks Office, and the Registrar makes its entries (s 207).
- subject: GC-0177
  predicate: actsAs
  object: GC-0136
  ref: TMM/Part60/2/2/2/2/4~4
  quote: Certification and Signature of the International Application by the Office of origin This is to
