# --- concepts moved to the kind they are ----------------------------------------
types:
- concept: GC-0007
  type: principle
  why: The presumption of registrability is a rule about how the grounds are applied — accept unless
    satisfied a ground exists (s 33(1)) — neither a ground nor a test; none_of_these said only that no
    kind fitted it.
- concept: GC-0051
  type: principle
  why: That section 43 applies mandatorily is a rule about the decision maker's discretion, not a
    question to answer.
- concept: GC-0180
  type: principle
  why: Office practice is how the office applies the Act where it leaves room — the Manual's own
    standing, practice rather than law.
- concept: GC-0141
  type: context
  why: A date, as the filing date and the priority date are; the context kind already holds dates.
- concept: GC-0155
  type: instrument_or_record
  why: A pending application is a trade mark application in a status (s 11), and applications are
    instruments or records.
- concept: GC-0163
  type: external_instrument
  why: The repealed Act (the 1955 Act) is a statute other than the 1995 Act that practice still refers
    to; the kind now holds statutes as well as treaties.
- concept: GC-0035
  type: process_role
  why: The concept names a person — the owner, registrant or licensed operator of a phoneword, domain
    name or call sign — not a circumstance.
- concept: GC-0150
  type: subject_matter
  why: An international registration is a registration, as a registered trade mark is, and an IRDA is a
    kind of one; its entry on the International Register is a relationship (isRecordedIn).
- concept: GC-0145
  type: context
  why: Where wine originates — tied by section 15 to where its grapes were grown — is a fact about the
    goods the assessment looks at, not a question the decision maker answers.
# --- a machine-written concept as the corpus uses it ----------------------------
concepts:
- concept: GC-0149
  set:
    pref_label: Office of the Contracting Party of the holder
    alt_labels: []
    not_labels: [designated Contracting Parties, Madrid Protocol]
    notes: The holder's "home" Office under the Madrid system — the IP office of the Contracting Party the
      holder belongs to, through which requests may be presented to the International Bureau; where it is
      the Trade Marks Office, the Registrar performs its functions (reg 17A.10(3)). Relabelled on
      2026-10-09 (ADR-0131) from "Contracting Party of the holder", which excluded its own Office — the
      only thing the Manual and the Regulations speak of.
  evidence:
  - ref: TMR1995/r17A.10(3)
    quote: (3) If a request is made through the Trade Marks Office, the Registrar must perform the
      functions, under the Protocol, of the Office of the Contracting Party of the holder in relation to the
      request.
  why: As first written the concept was the Contracting Party itself and listed "Office of the
    Contracting Party of the holder" as a label it must not be confused with; every passage that uses the
    term speaks of that Office, so recognition never found the concept and it connected to nothing.
- concept: GC-0126
  set:
    alt_labels: [term on the Wine Register, protected term]
  evidence:
  - ref: TMM/Part32B/2/1/2/1/4
    quote: Pending applications for inclusion on the Wine Register have no level of protection under the
      Wine Australia Act until they are on the Wine Register as a protected term.
  why: '"Protected term" is the Manual''s own name for a term on the Wine Register — 20 uses, all in Part
    32B — so recognition finds the concept where the Manual discusses it.'
  check: Whether "protected term" is used anywhere outside wine for something else.
