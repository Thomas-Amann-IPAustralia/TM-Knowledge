    content_hash: sha256:14a837dcde1a12b578590df4144304bdc6e1066b865971b068bda35119a32802
    quote: 'Connotation is not defined in the Trade Marks Act 1995 (the Act). The meaning
      for practical purposes has been taken from the ordinary dictionary definitions as set
      out below:'
  - ref: TMM/Part29/2/2/1~1
    span:
    - 499
    - 859
    content_hash: sha256:14a837dcde1a12b578590df4144304bdc6e1066b865971b068bda35119a32802
    quote: It is clear from these definitions that the word connotation refers to something
      implied in a trade mark, in addition to its essential or primary meaning. This has been
      supported and expanded upon by various Hearings decisions and the courts. In respect
      of section 43, connotation has a wide meaning beyond the above definitions and includes
      direct statements.
  - ref: TMM/Part29/2/2/1~1
    span:
    - 860
    - 1226
    content_hash: sha256:14a837dcde1a12b578590df4144304bdc6e1066b865971b068bda35119a32802
    quote: 'In Mount Everest Mineral Water Limited v Himalayan Spring Mineral Water [2010]
      ATMO 85, Hearing Officer Wilson stated: if a trade mark consists of a direct statement
      that the goods will originate from a particular region or outlines the nature of the
      goods, and there is scope within the goods/services for that statement to be misdescriptive,
      confusion will result.'
