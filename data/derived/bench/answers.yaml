answers:
- question: What is the test under section 43 and where does it come from?
  answer: '**Test — Manual practice:** The supplied Manual passages frame the enquiry as whether
    a connotation arising from the trade mark would be likely to deceive or confuse consumers
    within the relevant market. The express formulation supplied concerns references to Indigenous
    people; it directs that a section 43 ground for rejection should then be raised. [TMM/Part29/10#1]


    **Meaning and source of ‘connotation’:** The Manual says the Act does not define it. Its
    practical meaning comes from dictionary definitions: something implied in addition to
    the mark’s essential or primary meaning. The Manual says hearings decisions and courts
    have expanded that meaning, and that section 43 connotation includes direct statements.
    It illustrates this with *Mount Everest Mineral Water Limited v Himalayan Spring Mineral
    Water* [2010] ATMO 85, concerning potentially misdescriptive statements about origin or
    the nature of goods. [TMM/Part29/2/2/1~1]


    **Limit of these sources:** These are Manual statements of practice and explanation, not
    the legislative text. No passage reproduces section 43 of the Act or any relevant Regulation.
    Consequently, the supplied passages do not establish the exact statutory test or the judicial
    origin of the complete test; they establish the Manual’s formulation and its explanation
    of ‘connotation’.'
  citations:
